<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06040a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Regicide">
<meta name="description" content="REGICIDE: a roguelike raid. Five courts, five bosses, one crown.">
<title>REGICIDE</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06040a;color:#f1e7d2;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root{--gold:#ffd36b;--gold-hot:#fff3cf;--blood:#c8322e;--void:#06040a;--ink:#0d0a14;--accent:#ff7a2a;--bone:#f1e7d2;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;outline:none;touch-action:none}
#veil{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at 50% 45%,#1c0f1a 0%,#0a0612 55%,#06040a 100%);transition:opacity 1s ease;pointer-events:none}
#veil.gone{opacity:0}
#veil .crown{position:relative;width:96px;height:96px}
#veil .crown i{position:absolute;inset:0;border:1px solid rgba(255,211,107,.5);border-radius:50%;box-shadow:0 0 12px rgba(255,211,107,.22);animation:vspin 3.4s linear infinite;transform:rotateX(66deg)}
#veil .crown i:nth-child(2){inset:14px;animation:vspin2 2.4s linear infinite;border-color:rgba(255,243,207,.65)}
#veil .crown i:nth-child(3){inset:40px;border:0;background:radial-gradient(circle,#fff3cf 0%,#ffd36b 40%,rgba(200,50,46,0) 72%);animation:vpulse 1.6s ease-in-out infinite}
#veil .word{font-family:var(--serif);letter-spacing:.46em;font-size:15px;color:#e8c77a;text-shadow:0 0 14px rgba(255,211,107,.45);padding-left:.46em}
@keyframes vspin{from{transform:rotateX(66deg) rotateZ(0)}to{transform:rotateX(66deg) rotateZ(360deg)}}
@keyframes vspin2{from{transform:rotateY(64deg) rotateZ(0)}to{transform:rotateY(64deg) rotateZ(-360deg)}}
@keyframes vpulse{50%{transform:scale(1.25);opacity:.75}}
#boot-err{position:fixed;left:12px;right:12px;bottom:12px;z-index:101;font:12px/1.4 ui-monospace,Menlo,monospace;color:#ffb0a0;
  background:rgba(20,6,10,.85);border:1px solid #803030;border-radius:6px;padding:8px 10px;display:none;white-space:pre-wrap}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script>
window.addEventListener('error', function (e) {
  if (window.G && window.G.core) return;
  var el = document.getElementById('boot-err'); if (!el) return;
  el.style.display = 'block'; el.textContent = 'Failed to start: ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '') + '\nThe game needs a connection the first time it loads (Three.js from a CDN).';
}, true);
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><div class="crown"><i></i><i></i><i></i></div><div class="word">REGICIDE</div></div>
<div id="boot-err"></div>
