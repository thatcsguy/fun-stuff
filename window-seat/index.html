<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Thirty hand-picked puzzles for a long flight. Works offline.">
<title>Window Seat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#1d1f24;--mute:#6b6f78;--line:#d9d5cc;--thick:#1d1f24;--acc:#2f6fdf;--acc2:#e3ecfb;--ok:#2e9b5b;--okbg:#e2f4e9;--bad:#d2433b;--sel:#ffe9a8;--hl:#f3efe3;--fill:#23262d;--given:#1d1f24;--user:#2f6fdf;--lit:#fff4c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--panel:#1b1e24;--ink:#e9e7e2;--mute:#9399a3;--line:#343943;--thick:#d8d5cf;--acc:#79a6ff;--acc2:#21304d;--ok:#5cc98a;--okbg:#18342a;--bad:#ff7a70;--sel:#4a4224;--hl:#232730;--fill:#d8d5cf;--given:#e9e7e2;--user:#8db4ff;--lit:#3b3620}}
:root[data-theme="dark"]{--bg:#121418;--panel:#1b1e24;--ink:#e9e7e2;--mute:#9399a3;--line:#343943;--thick:#d8d5cf;--acc:#79a6ff;--acc2:#21304d;--ok:#5cc98a;--okbg:#18342a;--bad:#ff7a70;--sel:#4a4224;--hl:#232730;--fill:#d8d5cf;--given:#e9e7e2;--user:#8db4ff;--lit:#3b3620}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:26px;margin:14px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:66px}
.card b{font-size:15px}.card small{color:var(--mute);font-size:12px}
.card .n{font-size:12px;color:var(--mute)}
.card.done{background:var(--okbg);border-color:var(--ok)}
.card.done .n::after{content:"  ✓ solved";color:var(--ok);font-weight:600}
.card.started .n::after{content:"  · in progress"}
.foot{color:var(--mute);font-size:13px;margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--mute)}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 8px}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-size:18px}.top .t small{color:var(--mute);font-size:13px}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:42px;height:42px;font-size:18px;cursor:pointer;padding:0 10px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.rules p{margin:4px 0}.rules ul{margin:4px 0;padding-left:20px}
.rules.hide{display:none}
.board{position:relative;width:100%;margin:0 auto;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board.drag{touch-action:none}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
.status{min-height:24px;text-align:center;font-weight:600;margin:10px 0 4px;font-size:15px}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.status.info{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px;min-height:42px}
.btn.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.pad{display:grid;gap:6px;margin-top:10px}
.pad .btn{padding:8px 0;font-size:20px}
.solvedbanner{background:var(--okbg);border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;margin:8px 0}
svg text{font-family:inherit}
.kbd{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kbd div{display:flex;gap:4px;justify-content:center}
.kbd button{flex:1;max-width:40px;height:46px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:15px;padding:0;cursor:pointer}
.kbd button.wide{max-width:64px;font-size:13px}
</style>
<script>try{var t=localStorage.getItem('pz30.theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t))}catch(e){}</script>

var app = document.getElementById('app');

  var list = h('div', { class: 'list' });

    list.appendChild(h('button', { class: 'card' + (done[p.id] ? ' done' : (st ? ' started' : '')), 'data-i': i, onclick: function () { location.hash = '#' + (i + 1); } }, [

  });

    h('h1', { text: 'Window Seat' }),
    h('p', { class: 'sub', text: '30 puzzles for a long flight. No timer, no score: take your time, play in any order. Progress saves on this phone. ' + n + ' / 30 solved.' }),
    list,
    h('div', { class: 'foot' }, [
      h('span', { text: 'Works offline once loaded.' }),
      h('button', { text: 'Theme', onclick: function () {
        var t = document.documentElement.getAttribute('data-theme');

      } })

}

function openPuzzle(i) {
  var p = PUZ[i], T = TYPES[p.type];
  var st = store.get('st.' + p.id, null) || T.init(p);
  var undo = [];
  var wasSolved = !!solvedSet()[p.id];
  var board = h('div', { class: 'board' });
  var status = h('div', { class: 'status' });
  var banner = h('div');
  var tools = h('div', { class: 'bar' });
  var extra = h('div');
  var rules = h('div', { class: 'rules' + (store.get('seenrules.' + p.id, 0) ? ' hide' : ''), html: p.rules });
  var api = {
    p: p, board: board, status: status, extra: extra, mode: null, sel: null,
    get st() { return st; },
    act: function (fn, opts) {
      var before = JSON.stringify(st);
      var r = fn(st);
      if (r === false) return;
      if (JSON.stringify(st) === before) { api.render(); return; }
      if (!(opts && opts.noUndo)) { undo.push(before); if (undo.length > 300) undo.shift(); }
      api.commit();
    },
    commit: function () { store.set('st.' + p.id, st); api.render(); check(); },
    render: function () { T.render(p, st, api); undoBtn.disabled = !undo.length; },
    say: function (msg, cls) { status.textContent = msg || ''; status.className = 'status ' + (cls || 'info'); },
    reset: function () { st = T.init(p); undo = []; store.del('st.' + p.id); api.sel = null; api.say(''); api.render(); check(); }
  };
  function check() {
    var ok = T.solved(p, st);
    banner.innerHTML = '';
    if (ok) {
      banner.appendChild(h('div', { class: 'solvedbanner', text: 'Solved! Nicely done.' }));
      if (!wasSolved) { wasSolved = true; markSolved(p.id); }
      api.say('');
    }
  }
  var undoBtn = h('button', { class: 'btn', text: 'Undo', onclick: function () { if (!undo.length) return; st = JSON.parse(undo.pop()); store.set('st.' + p.id, st); api.say(''); api.render(); check(); } });
  var bar = h('div', { class: 'bar' }, [undoBtn]);
  if (T.errors) bar.appendChild(h('button', { class: 'btn', text: 'Check', onclick: function () {
    if (T.solved(p, st)) { api.say('All correct!', 'ok'); return; }
    var e = T.errors(p, st);
    if (e === 0) api.say('No mistakes so far.', 'ok'); else api.say('Something is not right yet.', 'bad');
  } }));
  bar.appendChild(h('button', { class: 'btn', text: 'Reset', onclick: function () { if (confirmReset()) api.reset(); } }));
  app.innerHTML = '';
  var wrap = h('div', { class: 'wrap' }, [
    h('div', { class: 'top' }, [
      h('button', { class: 'ib', text: '‹', 'aria-label': 'Back', onclick: function () { location.hash = ''; } }),
      h('div', { class: 't' }, [h('b', { text: '#' + (i + 1) + '  ' + p.name }), h('small', { text: p.kind })]),
      h('button', { class: 'ib', text: '?', 'aria-label': 'Rules', onclick: function () { rules.classList.toggle('hide'); store.set('seenrules.' + p.id, 1); } })
    ]),
    rules, banner, board, status, tools, extra, bar
  ]);
  app.appendChild(wrap);
  window.scrollTo(0, 0);
  if (T.tools) T.tools.forEach(function (t, k) {
    var b = h('button', { class: 'btn' + (k === 0 ? ' on' : ''), html: t.label, 'data-mode': t.mode, onclick: function () {
      api.mode = t.mode; Array.prototype.forEach.call(tools.children, function (x) { x.classList.toggle('on', x === b); });
    } });

}

    // column headers

      var x = lab + (cc - 1) * K + j + 0.5;
      svg.appendChild(s('text', { x: 0, y: 0, transform: 'translate(' + (x + 0.15) + ',' + (lab - 0.15) + ') rotate(-90)', 'font-size': 0.48, fill: 'var(--ink)', text: it }));
    });
    var rowCats = [0]; for (var k = n - 1; k >= 2; k--) rowCats.push(k);
    rowCats.forEach(function (rc, ri) {
      p.cats[rc].items.forEach(function (it, i) {
        svg.appendChild(s('text', { x: lab - 0.15, y: lab + ri * K + i + 0.66, 'text-anchor': 'end', 'font-size': 0.48, fill: 'var(--ink)', text: it }));
      });
    });
    T.blocks(p).forEach(function (B) {
      var x0 = lab + B.ci * K, y0 = lab + B.ri * K;
      for (var i = 0; i < K; i++) for (var j = 0; j < K; j++) (function (i, j) {
        var key = B.rc + ':' + i + '|' + B.cc + ':' + j, v = st.m[key] || 0;
        var r = s('rect', { x: x0 + j, y: y0 + i, width: 1, height: 1, fill: v === 2 ? 'var(--okbg)' : 'var(--panel)', stroke: 'var(--line)', 'stroke-width': 0.03, 'data-k': key, style: 'cursor:pointer' });
        r.addEventListener('click', function () { api.act(function (s2) { var nv = ((s2.m[key] || 0) + (api.mode === 2 ? 2 : 1)) % 3; if (api.mode === 2 && (s2.m[key] || 0) === 2) nv = 0; if (nv) s2.m[key] = nv; else delete s2.m[key]; }); });
        svg.appendChild(r);
        if (v === 1) svgText(svg, x0 + j + 0.5, y0 + i + 0.5, '✕', 0.5, 'var(--mute)', 400);
        if (v === 2) svgText(svg, x0 + j + 0.5, y0 + i + 0.5, '✓', 0.6, 'var(--ok)', 700);
      })(i, j);
      svg.appendChild(s('rect', { x: x0, y: y0, width: K, height: K, fill: 'none', stroke: 'var(--thick)', 'stroke-width': 0.06, 'pointer-events': 'none' }));
    });
    b.appendChild(svg);
    var ex = api.extra; ex.innerHTML = '';
    var ol = h('ol', { style: 'font-size:14px;padding-left:22px;margin:10px 0' });
    p.clues.forEach(function (c) { ol.appendChild(h('li', { text: c, style: 'margin:4px 0' })); });
    ex.appendChild(h('div', { class: 'rules' }, [h('b', { text: 'Clues' }), ol]));
  },
  tools: [{ label: 'Tap: ✕ then ✓', mode: 1 }, { label: 'Tap: ✓', mode: 2 }],
  truth: function (p, rc, i, cc, j) {
    // is item i of cat rc matched with item j of cat cc ?
    var person = rc === 0 ? i : p.sol[rc].indexOf(i);
    return p.sol[cc][person] === j;
  },
  solved: function (p, st) {
    var n = p.cats.length, K = p.cats[0].items.length;
    for (var cc = 1; cc < n; cc++) for (var i = 0; i < K; i++) for (var j = 0; j < K; j++) {
      if ((st.m['0:' + i + '|' + cc + ':' + j] === 2) !== TYPES.logic.truth(p, 0, i, cc, j)) return false;
    }
    return true;
  },
  errors: function (p, st) {
    var e = 0;
    for (var key in st.m) {
      var a = key.split('|'), x = a[0].split(':'), y = a[1].split(':');
      var t = TYPES.logic.truth(p, +x[0], +x[1], +y[0], +y[1]);
      if ((st.m[key] === 2) !== t && (st.m[key] === 2 || t)) e++;
    }
    return e;
  }
};
