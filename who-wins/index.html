<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Wins?</title>
<meta name="description" content="30 tiny satisfying simulations. Pick a ball, watch who wins.">
<style>
  :root { --bg: #111318; --panel: #1a1d25; --ink: #f3efe6; --dim: #9aa0ad; --line: #2a2e3a; --acc: #e2a336; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button.on { background: var(--acc); color: #1a1408; border-color: var(--acc); }
  #app { display: flex; height: 100%; }
  #picker { flex: 1; overflow-y: auto; padding: 16px 16px 40px; }
  header h1 { margin: 4px 0 2px; font-size: 1.8rem; letter-spacing: .5px; }
  header .sub { margin: 0 0 8px; color: var(--dim); }
  #record { color: var(--acc); font-weight: 700; min-height: 1.2em; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; padding: 6px; text-align: left; border-radius: 12px; gap: 4px; }
  .tile canvas { width: 100%; aspect-ratio: 9 / 16; border-radius: 8px; background: #222; display: block; }
  .tile .nm { font-weight: 700; font-size: .85rem; line-height: 1.15; }
  .tile .pl { color: var(--dim); font-size: .72rem; }
  .tile.cur { border-color: var(--acc); }
  .foot { margin-top: 24px; color: var(--dim); font-size: .85rem; }
  .foot a { color: var(--dim); }
  #play { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #stageWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { display: block; touch-action: manipulation; border-radius: 6px; }
  #bar { display: flex; gap: 6px; padding: 6px 8px 8px; flex-wrap: nowrap; justify-content: center; width: 100%; }
  #bar button { padding: 7px 9px; min-width: 40px; font-size: .95rem; }
  body.playing #picker { display: none; }
  body.playing #play { display: flex; }
  @media (min-width: 900px) {
    #play { display: flex; width: auto; flex: 0 0 auto; padding: 10px 16px 0 0; }
    body.playing #picker { display: block; }
    #bBack { display: none; }
  }
  #testOut { position: fixed; inset: 0; margin: 0; padding: 12px; overflow: auto; background: #0b0c10; color: #cde; font: 12px/1.4 ui-monospace, Menlo, monospace; z-index: 9; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <div id="picker">
    <header>
      <h1>Who Wins?</h1>
      <p class="sub">30 tiny simulations. Tap a contestant before it starts to back it.</p>
      <div id="record"></div>
      <div class="row"><button id="bRandom">🎲 Random</button><button id="bShuffle">▶ Shuffle play</button></div>
    </header>
    <div id="grid"></div>
    <p class="foot">Every round comes from a seed, so a great one can be shared: the seed is in the corner and in the address bar. <a href="../">All fun stuff</a></p>
  </div>
  <div id="play">
    <div id="stageWrap"><canvas id="cv" aria-label="simulation"></canvas></div>
    <div id="bar">
      <button id="bBack" title="All sims">☰</button>
      <button id="bRestart" title="New seed (R)">↻ New</button>
      <button id="bReplay" title="Same seed">⟲</button>
      <button id="bNext" title="Next sim (N)">⏭</button>
      <button id="bSpeed" title="Speed">1x</button>
      <button id="bShuf2" title="Shuffle play">🔀</button>
      <button id="bSound" title="Sound">🔇</button>
    </div>
  </div>
</div>
<pre id="testOut" hidden></pre>
<script>
'use strict';
// ---------- constants, seeded rng, palette ----------
const W = 540, H = 960, TAU = Math.PI * 2, DT = 1 / 120, MAX_T = 75;
const SIMS = [];
const PAL = [
  { n: 'Red', c: '#e5484d' }, { n: 'Orange', c: '#f76b15' }, { n: 'Gold', c: '#e2a336' },
  { n: 'Green', c: '#30a46c' }, { n: 'Teal', c: '#12a594' }, { n: 'Blue', c: '#3e63dd' },
  { n: 'Purple', c: '#8e4ec6' }, { n: 'Pink', c: '#d6409f' }
];
function hexRgb(h) { const v = parseInt(h.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function shade(h, k) { // k<0 darker, k>0 lighter
  const [r, g, b] = hexRgb(h), f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
PAL.forEach(p => { p.d = shade(p.c, -0.35); p.l = shade(p.c, 0.45); p.rgb = hexRgb(p.c); });

function RNG(seed) {
  let a = seed >>> 0;
  const r = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  r.ang = () => r() * TAU;
  r.sign = () => r() < 0.5 ? -1 : 1;
  return r;
}

// ---------- physics kit ----------
const K = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
  cont(rng, n) { return rng.shuffle(PAL.slice()).slice(0, n); },
  ball(x, y, r, ang, spd, ci) { return { x, y, r, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, ci, m: r * r, dead: false }; },
  speed(b, s) { const v = Math.hypot(b.vx, b.vy); if (v < 1e-6) { b.vx = s; b.vy = 0; return; } b.vx *= s / v; b.vy *= s / v; },
  // keep a ball from bouncing perfectly horizontally/vertically forever
  nudge(b, minA = 0.14) {
    const s = Math.hypot(b.vx, b.vy); if (s < 1e-6) return;
    let a = Math.atan2(b.vy, b.vx);
    for (let k = -2; k <= 2; k++) {
      const ax = k * Math.PI / 2, d = a - ax;
      if (Math.abs(d) < minA) { a = ax + (d >= 0 ? minA : -minA); b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; return; }
    }
  },
  // small seeded rotation of a bounce, so circle billiards never settle into a fixed orbit
  scatter(b, rng, a = 0.15) { const r = rng.range(-a, a), c = Math.cos(r), s = Math.sin(r), vx = b.vx; b.vx = vx * c - b.vy * s; b.vy = vx * s + b.vy * c; },
  move(b, dt) { b.x += b.vx * dt; b.y += b.vy * dt; },
  // elastic circle-circle; returns impact speed (0 if no hit)
  collide(a, b, e = 1) {
    const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr || d2 < 1e-9) return 0;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ma = a.m || a.r * a.r, mb = b.m || b.r * b.r;
    const ia = 1 / ma, ib = 1 / mb, ov = (rr - d) / (ia + ib);
    a.x -= nx * ov * ia; a.y -= ny * ov * ia; b.x += nx * ov * ib; b.y += ny * ov * ib;
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn >= 0) return 0.001;
    const j = -(1 + e) * vn / (ia + ib);
    a.vx -= j * ia * nx; a.vy -= j * ia * ny; b.vx += j * ib * nx; b.vy += j * ib * ny;
    return -vn;
  },
  // axis-aligned box walls (inside); returns bitmask 1=left 2=right 4=top 8=bottom
  box(b, x0, y0, x1, y1, e = 1) {
    let h = 0;
    if (b.x - b.r < x0) { b.x = x0 + b.r; if (b.vx < 0) b.vx = -b.vx * e; h |= 1; }
    if (b.x + b.r > x1) { b.x = x1 - b.r; if (b.vx > 0) b.vx = -b.vx * e; h |= 2; }
    if (b.y - b.r < y0) { b.y = y0 + b.r; if (b.vy < 0) b.vy = -b.vy * e; h |= 4; }
    if (b.y + b.r > y1) { b.y = y1 - b.r; if (b.vy > 0) b.vy = -b.vy * e; h |= 8; }
    return h;
  },
  // inside a circular wall; returns true on bounce
  ringIn(b, cx, cy, R, e = 1) {
    const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
    if (d + b.r <= R || d < 1e-6) return false;
    const nx = dx / d, ny = dy / d;
    b.x = cx + nx * (R - b.r); b.y = cy + ny * (R - b.r);
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
    return true;
  },
  // outside of a circle (ball bounces off a round obstacle)
  ringOut(b, cx, cy, R, e = 1) {
    const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);
    if (d - b.r >= R || d < 1e-6) return false;
    const nx = dx / d, ny = dy / d;
    b.x = cx + nx * (R + b.r); b.y = cy + ny * (R + b.r);
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
    return true;
  },
  // closest point on segment; returns [dist, t, cx, cy]
  segClosest(px, py, ax, ay, bx, by) {
    const ex = bx - ax, ey = by - ay, l2 = ex * ex + ey * ey;
    let t = l2 > 0 ? ((px - ax) * ex + (py - ay) * ey) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = ax + ex * t, cy = ay + ey * t;
    return [Math.hypot(px - cx, py - cy), t, cx, cy];
  },
  // circle vs thick segment (capsule); returns impact speed or 0. svx/svy = segment velocity at contact (moving walls)
  seg(b, ax, ay, bx, by, e = 1, th = 0, svx = 0, svy = 0) {
    const [d, , cx, cy] = K.segClosest(b.x, b.y, ax, ay, bx, by), rr = b.r + th;
    if (d >= rr) return 0;
    let nx, ny;
    if (d > 1e-6) { nx = (b.x - cx) / d; ny = (b.y - cy) / d; } else { nx = -(by - ay); ny = bx - ax; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l; }
    b.x = cx + nx * rr; b.y = cy + ny * rr;
    const rvx = b.vx - svx, rvy = b.vy - svy, vn = rvx * nx + rvy * ny;
    if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; return -vn; }
    return 0.001;
  },
  segX(ax, ay, bx, by, cx, cy, dx, dy) { // proper segment intersection -> [t,u] or null
    const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((cx - ax) * sy - (cy - ay) * sx) / den, u = ((cx - ax) * ry - (cy - ay) * rx) / den;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? [t, u] : null;
  },
  // all-pairs helper
  pairs(arr, fn) { for (let i = 0; i < arr.length; i++) { const a = arr[i]; if (a.dead) continue; for (let j = i + 1; j < arr.length; j++) { const b = arr[j]; if (!b.dead) fn(a, b); } } },
  // uniform spatial hash for many bodies
  hashPairs(arr, cell, fn) {
    const m = new Map();
    for (const o of arr) { if (o.dead) continue; const k = (Math.floor(o.x / cell) + 64) * 4096 + Math.floor(o.y / cell) + 64; let l = m.get(k); if (!l) m.set(k, l = []); l.push(o); }
    for (const [k, l] of m) {
      const cx = Math.floor(k / 4096), cy = k % 4096;
      for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) fn(l[i], l[j]);
      for (const [ox, oy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
        const l2 = m.get((cx + ox) * 4096 + cy + oy); if (!l2) continue;
        for (const a of l) for (const b of l2) fn(a, b);
      }
    }
  },
  // the last of `ids` (all dying this step) to keep: deterministic by score fn, tie broken by rng
  pickOne(rng, ids, scoreFn) { let best = -Infinity, out = []; for (const i of ids) { const s = scoreFn ? scoreFn(i) : 0; if (s > best + 1e-9) { best = s; out = [i]; } else if (Math.abs(s - best) <= 1e-9) out.push(i); } return out.length === 1 ? out[0] : rng.pick(out); },
  aliveIdx(st) { const r = []; for (let i = 0; i < st.C.length; i++) if (!st.out[i]) r.push(i); return r; },
  // mark contestants out; settle a winner when one (or none) remains
  knock(st, ids, scoreFn) {
    if (!ids.length || st.win != null) { ids.forEach(i => st.out[i] = true); return; }
    const before = K.aliveIdx(st);
    ids.forEach(i => { if (!st.out[i]) { st.out[i] = true; st.outT[i] = st.t; } });
    const left = K.aliveIdx(st);
    if (left.length === 1) st.win = left[0];
    else if (left.length === 0) { const w = K.pickOne(st.rng, before, scoreFn); st.out[w] = false; st.outT[w] = 0; st.win = w; }
  },
  base(rng, n, extra) { const C = K.cont(rng, n); return Object.assign({ rng, C, out: C.map(() => false), outT: C.map(() => 0), t: 0, win: null }, extra || {}); }
};

// ---------- visual-only particles (Math.random is fine here: never affects outcomes) ----------
const FX = {
  P: [], off: false, sh: 0, flashA: 0, flashC: '#fff',
  burst(x, y, col, n = 14, spd = 180, life = 0.6, size = 3, g = 0) {
    if (this.off) return;
    for (let i = 0; i < n && this.P.length < 400; i++) {
      const a = Math.random() * TAU, s = spd * (0.3 + Math.random() * 0.8);
      this.P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.6), max: life, col, size: size * (0.6 + Math.random() * 0.8), g, k: 0 });
    }
  },
  confetti(cols, n = 120) {
    if (this.off) return;
    for (let i = 0; i < n && this.P.length < 420; i++) this.P.push({ x: Math.random() * W, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 120, vy: 150 + Math.random() * 250, life: 3, max: 3, col: cols[i % cols.length], size: 5 + Math.random() * 4, g: 120, k: 1, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12 });
  },
  ring(x, y, col, r = 40, life = 0.5) { if (!this.off && this.P.length < 420) this.P.push({ x, y, vx: 0, vy: 0, life, max: life, col, size: r, g: 0, k: 2 }); },
  shake(a) { if (!this.off) this.sh = Math.max(this.sh, a); },
  flash(col, a = 0.35) { if (!this.off) { this.flashC = col; this.flashA = a; } },
  clear() { this.P.length = 0; this.sh = 0; this.flashA = 0; },
  update(dt) {
    for (let i = this.P.length - 1; i >= 0; i--) {
      const p = this.P[i]; p.life -= dt;
      if (p.life <= 0) { this.P.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.k === 0) { p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt; }
      if (p.k === 1) p.rot += p.vr * dt;
    }
    this.sh *= Math.pow(0.02, dt); this.flashA *= Math.pow(0.05, dt);
  },
  draw(ctx) {
    for (const p of this.P) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = p.k === 1 ? Math.min(1, a * 2) : a;
      if (p.k === 2) { ctx.strokeStyle = p.col; ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - a), 0, TAU); ctx.stroke(); }
      else if (p.k === 1) { ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
      else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }
};

// ---------- drawing kit ----------
const D = {
  cache: new Map(),
  mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  sprite(col, night) {
    const key = col + night; let s = this.cache.get(key); if (s) return s;
    s = this.mk(128, 128); const g = s.getContext('2d');
    const gr = g.createRadialGradient(46, 42, 4, 64, 64, 62);
    gr.addColorStop(0, shade(col, 0.55)); gr.addColorStop(0.35, col); gr.addColorStop(1, shade(col, -0.3));
    g.fillStyle = gr; g.beginPath(); g.arc(64, 64, 60, 0, TAU); g.fill();
    if (!night) { g.strokeStyle = shade(col, -0.45); g.lineWidth = 5; g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(44, 38, 16, 10, -0.6, 0, TAU); g.fill();
    this.cache.set(key, s); return s;
  },
  glowS(col) {
    const key = 'g' + col; let s = this.cache.get(key); if (s) return s;
    s = this.mk(128, 128); const g = s.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, rgba(col, 0.55)); gr.addColorStop(0.4, rgba(col, 0.18)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); this.cache.set(key, s); return s;
  },
  ball(ctx, x, y, r, col, night) {
    if (night) { ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(this.glowS(col), x - r * 2.6, y - r * 2.6, r * 5.2, r * 5.2); ctx.globalCompositeOperation = 'source-over'; }
    ctx.drawImage(this.sprite(col, night), x - r, y - r, r * 2, r * 2);
  },
  glow(ctx, x, y, r, col, a = 1) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.drawImage(this.glowS(col), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; },
  text(ctx, s, x, y, size, col, align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y);
  },
  circle(ctx, x, y, r, stroke, lw = 2, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } },
  line(ctx, ax, ay, bx, by, col, lw = 2) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); },
  // persistent offscreen layer kept on the state (not part of the simulation)
  layer(st, name, w = W, h = H) { st._lay = st._lay || {}; if (!st._lay[name]) st._lay[name] = this.mk(w, h); return st._lay[name]; }
};
const INK = '#2b2620', GOLD = '#c9a25a', PAPER = '#f3efe6', NIGHT = '#0e1116';

// ---------- one round without drawing (used by ?test=1 and the Node test) ----------
function tickSim(sim, st) { st.t += DT; sim.step(st, DT); }
function leadOf(sim, st) {
  if (sim.lead) return sim.lead(st);
  const v = sim.hud(st); let b = -Infinity, w = 0;
  v.forEach((x, i) => { const n = parseFloat(x); if (!st.out[i] && n > b) { b = n; w = i; } });
  return w;
}
function runRound(sim, seed, maxT = MAX_T) {
  const st = sim.init(RNG(seed));
  while (st.win == null && st.t < maxT) tickSim(sim, st);
  const capped = st.win == null; if (capped) st.win = leadOf(sim, st);
  return { win: st.win, t: st.t, capped, n: st.C.length };
}
// ---------- audio: one context, pentatonic blips, throttled ----------
const AU = {
  ctx: null, on: false, master: null, last: {}, voices: 0, noiseBuf: null,
  PENTA: [0, 2, 4, 7, 9],
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
    const n = this.ctx.sampleRate; this.noiseBuf = this.ctx.createBuffer(1, n, n);

// ===================== A. Arena brawls =====================
const AX = 270, AY = 548, AR = 255; // shared circular arena
const BX0 = 22, BY0 = 140, BX1 = 518, BY1 = 938; // shared box arena
function spread(rng, n, R, minD, cx = AX, cy = AY) { // n non-overlapping points in a disc
  const pts = [];
  for (let k = 0; pts.length < n && k < 5000; k++) {
    const a = rng.ang(), r = R * Math.sqrt(rng()), x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (pts.every(p => Math.hypot(p[0] - x, p[1] - y) > minD)) pts.push([x, y]);
  }
  while (pts.length < n) pts.push([cx + rng.range(-R, R) * 0.7, cy + rng.range(-R, R) * 0.7]);
  return pts;
}
function spreadBox(rng, n, minD, x0 = BX0 + 30, y0 = BY0 + 30, x1 = BX1 - 30, y1 = BY1 - 30) {
  const pts = [];
  for (let k = 0; pts.length < n && k < 5000; k++) { const x = rng.range(x0, x1), y = rng.range(y0, y1); if (pts.every(p => Math.hypot(p[0] - x, p[1] - y) > minD)) pts.push([x, y]); }
  while (pts.length < n) pts.push([rng.range(x0, x1), rng.range(y0, y1)]);
  return pts;
}
function drawBalls(st, ctx, night, extra) {
  for (const b of st.balls) {
    if (b.dead && !(b.fall > 0)) continue;
    const s = b.dead ? Math.max(0, b.fall) : 1;
    if (s <= 0) continue;
    ctx.globalAlpha = b.dead ? s : 1;
    D.ball(ctx, b.x, b.y, b.r * s, st.C[b.ci].c, night);
    if (extra) extra(b);
    ctx.globalAlpha = 1;
  }
}
function fallTick(st, dt, rate = 2) { for (const b of st.balls) if (b.dead && b.fall > 0) b.fall -= dt * rate; }

SIMS.push({

      for (let k = 0; k < 16; k++) { const a = a0 + (k - 7.5) * 0.15; b.th.push({ x: AX + Math.cos(a) * AR, y: AY + Math.sin(a) * AR }); }

  step(st, dt) {

    for (const a of B) {

    D.text(ctx, `${st.t.toFixed(1)}s`, 12, H - 14, 13, night ? '#6f7686' : '#9a8f7c', 'left', 700);
    D.text(ctx, `seed ${R.seed}`, W - 12, H - 14, 13, night ? '#6f7686' : '#9a8f7c', 'right', 600);
    if (R.speed > 1) D.text(ctx, `${R.speed}x`, W / 2, H - 14, 13, night ? '#6f7686' : '#9a8f7c', 'center', 800);

    if (R.phase === 'pre') {
      const k = R.preT / PRE;
      ctx.fillStyle = night ? 'rgba(8,10,14,0.72)' : 'rgba(40,34,26,0.62)'; rr(40, H / 2 - 80, W - 80, 150, 18); ctx.fill();
      D.text(ctx, sim.caption, W / 2, H / 2 - 38, 28, '#fff', 'center', 900);
      D.text(ctx, R.back >= 0 ? `You backed ${st.C[R.back].n}` : 'Tap a contestant to back it', W / 2, H / 2 + 4, 18, R.back >= 0 ? st.C[R.back].l : '#e8e2d6', 'center', 700);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; rr(80, H / 2 + 36, W - 160, 8, 4); ctx.fill();
      ctx.fillStyle = '#fff'; rr(80, H / 2 + 36, (W - 160) * (1 - k), 8, 4); ctx.fill();
    }
    if (R.paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
      D.text(ctx, '❚❚ paused', W / 2, H / 2, 34, '#fff');
    }
    if (R.phase === 'done') banner(night);
  }
  function banner(night) {
    const st = R.st, c = st.C[st.win], k = Math.min(1, R.doneT / 0.35), e = 1 - Math.pow(1 - k, 3);
    const y = H / 2 - 150 + (1 - e) * 60;
    ctx.globalAlpha = e;
    ctx.fillStyle = 'rgba(12,12,16,0.86)'; rr(30, y, W - 60, 300, 22); ctx.fill();
    ctx.strokeStyle = c.c; ctx.lineWidth = 4; ctx.stroke();
    D.ball(ctx, W / 2, y + 46, 24, c.c, true);
    D.text(ctx, `${c.n.toUpperCase()} WINS`, W / 2, y + 104, 46, c.l || c.c, 'center', 900);
    D.text(ctx, `in ${st.t.toFixed(1)} s`, W / 2, y + 142, 17, '#c9c4b8', 'center', 600);
    const t = store.tally[R.sim.id] || {};
    const list = Object.entries(t).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n, v]) => `${n} ${v}`).join('  ·  ');
    D.text(ctx, 'All-time here: ' + list, W / 2, y + 178, 15, '#a9a497', 'center', 600);
    if (R.back >= 0) {
      const ok = R.back === st.win;
      D.text(ctx, ok ? `✓ You called it! (${store.right} of ${store.total})` : `✗ You backed ${st.C[R.back].n} (${store.right} of ${store.total})`, W / 2, y + 214, 18, ok ? '#7ee2a8' : '#f0a0a0', 'center', 800);
    }
    D.text(ctx, R.shuffle ? 'Next sim in a moment…' : 'Tap for another round', W / 2, y + 260, 16, '#8f8a80', 'center', 600);
    ctx.globalAlpha = 1;
  }

  // ----- input -----
  cv.addEventListener('pointerdown', ev => {
    AU.init(); if (!AU.on && !R.userMuted) { AU.on = true; if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); syncButtons(); }
    const rect = cv.getBoundingClientRect(), x = (ev.clientX - rect.left) * W / rect.width, y = (ev.clientY - rect.top) * H / rect.height;
    const st = R.st, sim = R.sim; if (!st) return;
    if (R.phase === 'pre') {
      let hit = -1;
      chipRects(st.C.length).forEach((r, i) => { if (x >= r.x && x <= r.x + r.w && y >= r.y - 6 && y <= r.y + r.h + 6) hit = i; });
      if (hit < 0) {
        const pts = sim.where ? sim.where(st) : (st.balls || []).filter(b => !b.dead && b.ci != null).map(b => ({ i: b.ci, x: b.x, y: b.y, r: b.r }));
        let bd = 1e9; for (const p of pts) { const d = Math.hypot(p.x - x, p.y - y); if (d < Math.max(p.r + 24, 30) && d < bd) { bd = d; hit = p.i; } }
      }
      if (hit >= 0) { R.back = hit; AU.blip(10); }
      return;
    }
    if (R.phase === 'done') { start(R.si); return; }
    if (R.phase === 'run') R.paused = !R.paused;
  });
  window.addEventListener('keydown', e => {
    if (!R.sim) return;
    if (e.key === 'r' || e.key === 'R') start(R.si);
    else if (e.key === 'n' || e.key === 'N') start(pickNext());
    else if (e.key === ' ') { e.preventDefault(); if (R.phase === 'run') R.paused = !R.paused; }
  });
  function syncButtons() {
    $('bSpeed').textContent = R.speed + 'x';
    $('bSound').textContent = AU.on ? '🔊' : '🔇';
    $('bShuffle').classList.toggle('on', R.shuffle); $('bShuf2').classList.toggle('on', R.shuffle);
  }
  $('bRestart').onclick = () => start(R.si);
  $('bReplay').onclick = () => start(R.si, R.seed);
  $('bNext').onclick = () => start(pickNext());
  $('bSpeed').onclick = () => { R.speed = R.speed === 1 ? 2 : R.speed === 2 ? 4 : 1; syncButtons(); };
  $('bSound').onclick = () => { AU.init(); AU.on = !AU.on; R.userMuted = !AU.on; if (AU.on && AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); syncButtons(); };
  const toggleShuffle = () => { R.shuffle = !R.shuffle; syncButtons(); if (R.shuffle && (!R.sim || R.phase === 'done' || !document.body.classList.contains('playing'))) start(pickNext()); };
  $('bShuffle').onclick = toggleShuffle; $('bShuf2').onclick = toggleShuffle;
  $('bRandom').onclick = () => start(Math.floor(Math.random() * SIMS.length));
  $('bBack').onclick = () => { document.body.classList.remove('playing'); R.shuffle = false; syncButtons(); try { history.replaceState(null, '', location.pathname); } catch (e) { } };

  // ----- picker -----
  function updateRecord() { $('record').textContent = store.total ? `Your picks: ${store.right} of ${store.total} right` : ''; }
  function updateTile(i) { const el = document.querySelector(`.tile[data-i="${i}"] .pl`); if (el) { const n = store.played[SIMS[i].id] || 0; el.textContent = n ? `${n} played` : 'new'; } }
  function buildGrid() {
    const grid = $('grid');
    SIMS.forEach((s, i) => {
      const b = document.createElement('button'); b.className = 'tile'; b.dataset.i = i;
      b.innerHTML = `<canvas width="135" height="240"></canvas><span class="nm">${s.name}</span><span class="pl"></span>`;
      b.onclick = () => start(i); grid.appendChild(b); updateTile(i);
    });
    // thumbnails: the real opening frame of each sim, rendered one at a time
    const off = D.mk(W, H), oc = off.getContext('2d'); let i = 0;
    const next = () => {
      if (i >= SIMS.length) return;
      const s = SIMS[i], c = document.querySelector(`.tile[data-i="${i}"] canvas`);
      try {
        const st = s.init(RNG(1000 + i)); for (let k = 0; k < (s.thumbSteps || 60); k++) tickSim(s, st);
        oc.setTransform(1, 0, 0, 1, 0, 0); oc.fillStyle = s.theme === 'night' ? NIGHT : PAPER; oc.fillRect(0, 0, W, H);
        s.draw(st, oc, s.theme === 'night');
        c.getContext('2d').drawImage(off, 0, 0, W, H, 0, 0, c.width, c.height);
      } catch (e) { console.error('thumb', s.id, e); }
      i++; setTimeout(next, 16);
    };
    setTimeout(next, 50);
  }

  // ----- dev: headless fairness test (?test=1&n=200&sim=id) -----
  function runTests(n, only) {
    const out = $('testOut'); out.hidden = false; out.textContent = `Fairness test, ${n} seeds per sim\n`;
    const list = SIMS.filter(s => !only || s.id === only); let k = 0;
    const one = () => {
      if (k >= list.length) { out.textContent += '\nDONE'; window.__testDone = true; return; }
      const s = list[k++], wins = {}, ts = []; let capped = 0, slots = 0, err = '';
      try {
        for (let j = 0; j < n; j++) { const r = runRound(s, 7000 + j); slots = r.n; wins[r.win] = (wins[r.win] || 0) + 1; ts.push(r.t); if (r.capped) capped++; }
      } catch (e) { err = ' ERROR ' + e.message; }
      ts.sort((a, b) => a - b);
      const shares = Array.from({ length: slots }, (_, i) => ((wins[i] || 0) / n * slots).toFixed(2));
      out.textContent += `${s.id.padEnd(10)} med ${(ts[ts.length >> 1] || 0).toFixed(1)}s worst ${(ts[ts.length - 1] || 0).toFixed(1)}s capped ${capped}  slot share x fair: ${shares.join(' ')}${err}\n`;
      setTimeout(one, 0);
    };
    setTimeout(one, 0);
  }

  window.__ww = { R, start, SIMS };
  // ----- boot -----
  const q = new URLSearchParams(location.search);
  buildGrid(); updateRecord(); syncButtons();
  if (q.get('test')) { runTests(+q.get('n') || 200, q.get('sim')); return; }
  const qi = SIMS.findIndex(s => s.id === q.get('sim'));
  if (qi >= 0) start(qi, q.get('seed') ? (+q.get('seed') >>> 0) : null);
  else if (wide()) start(Math.floor(Math.random() * SIMS.length));
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
