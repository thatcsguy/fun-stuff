<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pack Ripper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B4%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0c12; --bg2: #12131c; --panel: #171927; --panel2: #1f2233; --line: #2b2f45;
  --ink: #f1f2f8; --dim: #9aa0b8; --gold: #ffcf4a; --pink: #ff6fb1; --good: #4ade80; --bad: #f87171;
  --c0: #a3acbf; --c1: #4ade80; --c2: #60a5fa; --c3: #c084fc; --c4: #fbbf24; --c5: #ff5fa2;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body {
  color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  position: fixed; inset: 0;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
#app { position: absolute; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
body.frenzy #app { box-shadow: inset 0 0 60px rgba(255, 111, 177, .35); animation: frz 1s ease-in-out infinite alternate; }
@keyframes frz { to { box-shadow: inset 0 0 90px rgba(255, 207, 74, .45); } }

/* header */
#top { padding: calc(var(--sat) + 8px) 14px 6px; background: linear-gradient(#0b0c12, rgba(11,12,18,.92)); position: relative; z-index: 5; }
#toprow { display: flex; align-items: center; gap: 10px; }
#coins { font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
#coins small { font-size: 15px; margin-right: 2px; }
#ips { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
#ips b { color: var(--ink); font-weight: 650; }
#cloutTag { margin-left: auto; font-weight: 700; color: var(--pink); font-size: 14px; background: rgba(255,111,177,.12); padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
#hypebar { margin-top: 7px; height: 16px; background: var(--panel); border-radius: 99px; overflow: hidden; position: relative; border: 1px solid var(--line); }
#hypefill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ff6fb1, #ffcf4a); transition: width .2s; }
#hypetxt { position: absolute; inset: 0; text-align: center; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; line-height: 14px; color: #fff; text-shadow: 0 1px 2px #000; }
body.frenzy #hypefill { animation: hyp .4s linear infinite alternate; }
@keyframes hyp { to { filter: hue-rotate(40deg) brightness(1.3); } }

/* views */
#views { flex: 1; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px 14px 20px; display: none; }
.view.on { display: block; }
#v-rip { display: none; flex-direction: column; padding: 0; overflow: hidden; }
#v-rip.on { display: flex; }

/* tabs */
#tabs { display: flex; background: var(--bg2); border-top: 1px solid var(--line); padding-bottom: var(--sab); position: relative; z-index: 5; }
#tabs button { flex: 1; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--dim); position: relative; }
#tabs button .ti { font-size: 21px; line-height: 1.1; filter: grayscale(.6); opacity: .8; }
#tabs button.on { color: var(--ink); }
#tabs button.on .ti { filter: none; opacity: 1; transform: scale(1.1); }
#tabs .dot { position: absolute; top: 5px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); display: none; }
#tabs .dot.on { display: block; }

/* rip view */
#setbar { display: flex; gap: 7px; overflow-x: auto; padding: 8px 14px 6px; scrollbar-width: none; flex: none; }
#setbar::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 11px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.chip.on { border-color: var(--sc, #fff); background: color-mix(in srgb, var(--sc, #fff) 22%, var(--panel)); font-weight: 650; }
.chip.lock { color: var(--dim); border-style: dashed; }
.chip.lock.can { color: var(--gold); border-color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
.chip .pr { font-size: 11px; opacity: .9; }
@keyframes pulse { 50% { box-shadow: 0 0 12px rgba(255,207,74,.5); } }
#stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stageInfo { position: absolute; top: 4px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); pointer-events: none; z-index: 2; }
#ripctl { flex: none; padding: 8px 14px 10px; display: flex; gap: 8px; align-items: stretch; }
#ripBtn { flex: 1; background: linear-gradient(180deg, #ffd960, #f2a91c); color: #2a1a00; font-weight: 900; font-size: 19px; border-radius: 16px; padding: 12px 10px 10px; letter-spacing: .04em; box-shadow: 0 4px 0 #a86d07, 0 8px 20px rgba(242,169,28,.25); line-height: 1.1; }
#ripBtn small { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: 0; opacity: .85; }
#ripBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86d07; }
#ripBtn.no { filter: grayscale(.8) brightness(.7); }
#rip10 { width: 74px; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; font-weight: 800; font-size: 16px; line-height: 1.1; display: none; }
#rip10 small { display: block; font-size: 11px; color: var(--dim); font-weight: 600; }
#rip10.no { opacity: .5; }
#feed { position: absolute; left: 10px; right: 10px; bottom: 4px; display: flex; flex-direction: column-reverse; gap: 3px; pointer-events: none; z-index: 3; align-items: center; }
.fd { font-size: 12px; background: rgba(23,25,39,.88); border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; animation: fdin .3s ease-out, fdout .6s ease-in 3.4s forwards; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@keyframes fdin { from { transform: translateY(8px); opacity: 0; } }
@keyframes fdout { to { opacity: 0; transform: translateY(-6px); } }

/* pack */
.pack { position: relative; width: min(54vw, 210px); aspect-ratio: 5 / 7.4; transform-origin: 50% 80%; animation: bob 2.6s ease-in-out infinite; cursor: pointer; }
.pack.gold .pbody, .pack.gold .ptop { --pc: #d4a017; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(1deg); } }
.pbody, .ptop { position: absolute; left: 0; right: 0; background: linear-gradient(150deg, color-mix(in srgb, var(--pc) 85%, #fff) 0%, var(--pc) 38%, color-mix(in srgb, var(--pc) 55%, #000) 100%); overflow: hidden; }
.ptop { top: 0; height: 13%; border-radius: 8px 8px 0 0; clip-path: polygon(0 0,100% 0,100% 80%,95% 100%,90% 80%,85% 100%,80% 80%,75% 100%,70% 80%,65% 100%,60% 80%,55% 100%,50% 80%,45% 100%,40% 80%,35% 100%,30% 80%,25% 100%,20% 80%,15% 100%,10% 80%,5% 100%,0 80%); z-index: 2; }
.ptop::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 3px, transparent 3px 7px); }
.pbody { top: 11%; bottom: 0; border-radius: 0 0 10px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.pbody::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%); animation: sheen 3.2s ease-in-out infinite; }
@keyframes sheen { 0% { transform: translateX(-60%); } 60%, 100% { transform: translateX(60%); } }
.pemo { font-size: min(18vw, 74px); line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); background: rgba(255,255,255,.14); border-radius: 50%; width: 1.45em; height: 1.45em; display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,.35); }
.pname { font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; text-shadow: 0 2px 0 rgba(0,0,0,.35); text-align: center; padding: 0 6px; line-height: 1.05; }
.psub { font-size: 10px; font-weight: 700; letter-spacing: .2em; opacity: .8; }
.pstripe { position: absolute; bottom: 9%; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--c0), var(--c1), var(--c2), var(--c3), var(--c4), var(--c5)); opacity: .85; }
.pack.shake { animation: pshake .32s linear; }
@keyframes pshake { 20% { transform: rotate(-4deg) scale(1.03); } 40% { transform: rotate(4deg) scale(1.05); } 60% { transform: rotate(-3deg) scale(1.06); } 80% { transform: rotate(2deg) scale(1.04); } }
.pack.torn .ptop { animation: tearoff .5s cubic-bezier(.3,.6,.4,1) forwards; }
@keyframes tearoff { to { transform: translate(60%, -140%) rotate(28deg); opacity: 0; } }
.pack.torn .pbody { animation: dropout .45s .15s ease-in forwards; }
@keyframes dropout { to { transform: translateY(70%) scale(.9); opacity: 0; } }
.gpk { animation: bob 1.4s ease-in-out infinite; }

/* reveal grid */
#reveal { position: absolute; inset: 22px 8px 30px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; z-index: 2; }
#reveal.ten { gap: 6px; }
.card { width: min(29vw, 150px); aspect-ratio: 5 / 7; perspective: 700px; position: relative; flex: none; }
#reveal.n6 .card, #reveal.n7 .card, #reveal.n8 .card { width: min(27vw, 128px); }
#reveal.ten .card { width: min(21vw, 104px); }
#reveal.ten { gap: 12px 6px; }
.cardi { position: absolute; inset: 0; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .38s cubic-bezier(.3,1.4,.5,1); }
.card.flip .cardi { transform: rotateY(180deg); }
.card.deal { animation: deal .35s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes deal { from { transform: translateY(45vh) scale(.4) rotate(-12deg); opacity: 0; } }
.face { position: absolute; inset: 0; border-radius: 9px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.back { background: repeating-linear-gradient(45deg, #23264a 0 8px, #1b1d3a 8px 16px); border: 3px solid #3a3f70; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.back span { background: #0b0c12; border-radius: 50%; width: 1.6em; height: 1.6em; display: flex; align-items: center; justify-content: center; border: 2px solid #ffcf4a; font-size: .8em; }
.front { transform: rotateY(180deg); border: 3px solid var(--rc); background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--sc) 70%, #fff) 0%, var(--sc) 35%, color-mix(in srgb, var(--sc) 30%, #000) 100%); display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(0,0,0,.5) inset; }
.card.r3 .front, .card.r4 .front { box-shadow: 0 0 14px var(--rc) inset; }
.card.r5 .front { border-image: linear-gradient(var(--a, 0deg), #ff5fa2, #ffcf4a, #4ade80, #60a5fa, #c084fc, #ff5fa2) 1; animation: myth 2s linear infinite; }
@keyframes myth { to { filter: hue-rotate(360deg); } }
.art { flex: 1; display: flex; align-items: center; justify-content: center; font-size: calc(min(29vw, 150px) * .42); line-height: 1; position: relative; filter: drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
#reveal.ten .art, .mini .art { font-size: calc(min(22vw, 104px) * .42); }
.acc { position: absolute; font-size: .42em; right: 10%; top: 8%; filter: drop-shadow(0 0 4px #fff8); }
.nm { background: rgba(0,0,0,.55); font-size: 11px; font-weight: 750; text-align: center; padding: 3px 3px 1px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr { background: rgba(0,0,0,.55); color: var(--rc); font-size: 8.5px; font-weight: 900; letter-spacing: .12em; text-align: center; padding: 0 2px 3px; }
.holo .front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 15%, rgba(255,80,200,.45) 32%, rgba(80,255,255,.45) 48%, rgba(255,255,90,.45) 64%, transparent 82%); background-size: 260% 260%; mix-blend-mode: color-dodge; animation: holo 2.4s linear infinite; pointer-events: none; }
@keyframes holo { from { background-position: 100% 100%; } to { background-position: -160% -160%; } }
.badge { position: absolute; z-index: 3; font-size: 9.5px; font-weight: 900; padding: 2px 5px; border-radius: 5px; letter-spacing: .04em; opacity: 0; transform: scale(.4); transition: all .25s cubic-bezier(.3,1.6,.5,1) .25s; pointer-events: none; }
.card.flip .badge { opacity: 1; transform: none; }
.b-new { top: -6px; left: -5px; background: var(--gold); color: #2a1a00; }
.b-lv { top: -6px; right: -5px; background: var(--good); color: #032b10; }
.b-holo { bottom: -6px; left: 50%; margin-left: -18px; background: linear-gradient(90deg, #ff6fb1, #6ff, #ff6); color: #000; }
.b-val { bottom: -7px; right: -4px; background: #000c; color: var(--gold); border: 1px solid #ffcf4a55; }
.card.tease { animation: tease .14s linear infinite; }
.card.tease .back { box-shadow: 0 0 26px 6px var(--rc); border-color: var(--rc); }
@keyframes tease { 25% { transform: translate(-2px, 1px) rotate(-2deg); } 75% { transform: translate(2px, -1px) rotate(2deg); } }
.card.pop { animation: cpop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes cpop { 40% { transform: scale(1.18); } }
.card.away { transition: transform .35s ease-in, opacity .35s; transform: translateY(-60vh) scale(.3) rotate(15deg); opacity: 0; }
#revealMore { width: 100%; text-align: center; color: var(--dim); font-size: 13px; }
#tapHint { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--dim); pointer-events: none; z-index: 2; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* banners / overlays */
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; }
#flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }
#banner { position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; z-index: 41; font-weight: 950; font-size: 38px; letter-spacing: .03em; opacity: 0; text-shadow: 0 4px 0 rgba(0,0,0,.5), 0 0 30px currentColor; }
#banner.go { animation: ban 1.6s cubic-bezier(.2,1.2,.4,1) forwards; }
#banner small { display: block; font-size: 15px; letter-spacing: .2em; color: #fff; text-shadow: 0 2px 0 #000; }
@keyframes ban { 0% { opacity: 0; transform: scale(2.4); } 15% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) scale(.95); } }
body.shake #app { animation: scr .4s linear; }
@keyframes scr { 10%, 50%, 90% { transform: translate(-5px, 2px); } 30%, 70% { transform: translate(5px, -3px); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 39; width: 100%; height: 100%; }
.float { position: fixed; z-index: 42; pointer-events: none; font-weight: 900; color: var(--gold); font-size: 17px; text-shadow: 0 2px 0 #000; animation: flt 1.1s ease-out forwards; white-space: nowrap; }
@keyframes flt { to { transform: translateY(-70px); opacity: 0; } }
#toast { position: fixed; top: calc(var(--sat) + 70px); left: 50%; transform: translateX(-50%); z-index: 45; display: flex; flex-direction: column; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.tst { background: #1f2233f2; border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--gold)); padding: 8px 12px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.5); animation: fdin .3s ease-out, fdout .5s ease-in 3.2s forwards; }
#golden { position: fixed; z-index: 30; font-size: 46px; width: 70px; height: 70px; display: none; align-items: center; justify-content: center; filter: drop-shadow(0 0 14px #ffcf4a) drop-shadow(0 0 30px #ffcf4a); animation: gold 1.1s ease-in-out infinite alternate; }
#golden.on { display: flex; }
@keyframes gold { from { transform: rotate(-12deg) scale(.92); } to { transform: rotate(12deg) scale(1.1); } }
#golden::after { content: "FREE"; position: absolute; bottom: -2px; font-size: 10px; font-weight: 900; background: var(--gold); color: #000; padding: 1px 5px; border-radius: 5px; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,10,.78); display: none; align-items: center; justify-content: center; padding: 20px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
#modal.on { display: flex; }
#mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: min(100%, 400px); max-height: 85vh; overflow-y: auto; animation: mpop .3s cubic-bezier(.3,1.4,.5,1); }
@keyframes mpop { from { transform: scale(.85); opacity: 0; } }
#mbox h2 { margin: 0 0 8px; font-size: 20px; }
#mbox p { margin: 6px 0; color: var(--dim); }
.mbtn { display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--gold); color: #2a1a00; font-weight: 800; font-size: 16px; }
.mbtn.sec { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }
.mbtn.danger { background: #7f1d1d; color: #fff; }

/* lists */
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 16px 0 8px; font-weight: 750; }
h3:first-child { margin-top: 6px; }
.row { display: flex; align-items: center; gap: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; margin-bottom: 8px; }
.row .ri { font-size: 26px; width: 34px; text-align: center; flex: none; }
.row .rt { flex: 1; min-width: 0; }
.row .rn { font-weight: 700; }
.row .rn em { font-style: normal; color: var(--dim); font-weight: 600; font-size: 12.5px; margin-left: 4px; }
.row .rd { color: var(--dim); font-size: 12.5px; }
.buy { flex: none; min-width: 84px; padding: 9px 10px; border-radius: 11px; background: var(--gold); color: #2a1a00; font-weight: 800; font-size: 14px; line-height: 1.1; text-align: center; }
.buy.pinkb { background: var(--pink); color: #2b0016; }
.buy.no { background: var(--panel2); color: var(--dim); }
.buy.max { background: transparent; color: var(--good); border: 1px solid var(--line); }
.row.hidden { opacity: .45; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 6px 11px; font-size: 13px; color: var(--dim); }
.seg button.on { background: var(--panel2); color: var(--ink); font-weight: 700; }
.ctlrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.big { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.big .v { font-size: 22px; font-weight: 800; }
.muted { color: var(--dim); font-size: 13px; }
.license { border-color: var(--gold); background: linear-gradient(135deg, rgba(255,207,74,.12), var(--panel)); }

/* binder */
.setcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-bottom: 12px; }
.sethead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sethead .se { font-size: 24px; }
.sethead .sn { font-weight: 800; flex: 1; }
.sethead .sp { font-size: 12px; color: var(--dim); text-align: right; }
.tag { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 5px; margin-left: 4px; vertical-align: 2px; }
.tag.cmp { background: var(--good); color: #032b10; }
.tag.mst { background: linear-gradient(90deg, #ff5fa2, #ffcf4a); color: #000; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mini { aspect-ratio: 5 / 7; border-radius: 7px; border: 2px solid var(--rc); position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--sc) 60%, #fff) 0%, var(--sc) 40%, color-mix(in srgb, var(--sc) 30%, #000) 100%); display: flex; align-items: center; justify-content: center; }
.mini .me { font-size: min(8vw, 34px); filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); position: relative; }
.mini .me .acc { font-size: .5em; right: -30%; top: -20%; }
.mini.un { background: var(--bg2); border-color: color-mix(in srgb, var(--rc) 35%, transparent); border-style: dashed; }
.mini.un .me { filter: brightness(0) opacity(.35); }
.mini .ml { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.6); font-size: 9px; font-weight: 800; text-align: center; padding: 1px 0; }
.mini.holo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 15%, rgba(255,80,200,.45) 32%, rgba(80,255,255,.45) 48%, rgba(255,255,90,.45) 64%, transparent 82%); background-size: 260% 260%; mix-blend-mode: color-dodge; animation: holo 2.4s linear infinite; }
.mini.r5 { animation: myth 2s linear infinite; }
.setcard.locked { opacity: .5; }
.prog { height: 5px; background: var(--bg2); border-radius: 9px; overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--good); }

    var got = sellOut(st); sfx.big(); flash('#ff6fb1'); shake();

    burst(innerWidth / 2, innerHeight / 2, ['#ff6fb1', '#ffcf4a', '#fff'], 160, { speed: 10, life: 90, size: 8 });
    dirty.binder = dirty.shop = dirty.crew = true;
    showPack(); renderSetbar(); VIEWS.clout.build(); save();
  });
}
function modal(html) {
  $('mbox').innerHTML = html; $('modal').classList.add('on');
  $('mbox').querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
}
function closeModal() { $('modal').classList.remove('on'); }
$('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
function howTo() {
  modal('<h2>🎴 Pack Ripper</h2>' +
    '<p><b>Rip packs.</b> Tap the pack or RIP. Every card pays out instantly, and every card you own earns coins per second, even while you are away.</p>' +
    '<p><b>Duplicates level cards up.</b> More copies, more income. Complete a set for ×1.5, find its Mythic for ×2 more. Holo cards double a card\'s income.</p>' +
    '<p><b>Hire a crew</b> to rip packs automatically. Buy <b>upgrades</b> and <b>licenses</b> for new sets in the Shop.</p>' +
    '<p><b>Ripping by hand</b> fills the HYPE bar. When full: Hype Frenzy, multiplied income and better luck. Tap 🎁 golden packs when they float by.</p>' +
    '<p><b>Sell Out</b> (⭐ tab) once progress slows: restart with permanent Clout bonuses and perks.</p>' +
    '<button class="mbtn" data-close>Let\'s rip!</button>');
}

/* ---------- offline ---------- */
function runAway(secs, showSummary) {
  var cap = offlineCap(st), t = Math.min(secs, cap);
  var c0 = st.coins, packs = 0, news = {}, best = -1, steps = Math.min(300, Math.max(1, Math.ceil(t / 10))), h = t / steps;
  for (var i = 0; i < steps; i++) {
    var r = tick(st, h, offlineRate(st));
    if (r) { packs += r.packs; if (r.best > best) best = r.best; r.news.forEach(function (n) { news[n.id] = news[n.id] || n; if (n.newHolo) news[n.id].newHolo = true; }); }
  }
  dirty.binder = dirty.shop = dirty.crew = dirty.clout = true;
  if (!showSummary) return;
  var ids = Object.keys(news), gain = st.coins - c0;
  var h2 = '<h2>Welcome back!</h2><p>You were away ' + fmtT(secs) + (secs > cap ? ' (capped at ' + fmtT(cap) + ')' : '') + '. Offline earnings run at ' + Math.round(offlineRate(st) * 100) + '%.</p>' +
    '<div class="big"><div class="v" style="color:var(--gold)">' + (gain >= 0 ? '+' : '') + '$' + fmt(Math.abs(gain)) + '</div><div class="muted">net coins' + (packs ? ', after your crew ripped ' + fmt(packs) + ' packs' : '') + '</div></div>';
  if (ids.length) {
    h2 += '<p>New cards & holos:</p><div class="grid" style="margin:6px 0">';
    ids.slice(0, 15).forEach(function (id) { h2 += miniHTML(+id); });
    h2 += '</div>' + (ids.length > 15 ? '<p>+' + (ids.length - 15) + ' more</p>' : '');
  }
  h2 += '<button class="mbtn" data-close>Collect</button>';
  modal(h2);
}

/* ---------- main loop ---------- */
var lastT = performance.now(), lastWall = Date.now(), uiT = 0, saveT = 0, crewAgg = { packs: 0, coins: 0, t: 0 }, prevInc = -1;
function frame(now) {
  var wall = Date.now(), dt = (wall - lastWall) / 1000; lastWall = wall; lastT = now;
  if (dt > 8) { runAway(dt, dt > 60); }
  else if (dt > 0) {
    var r = tick(st, dt, 1);
    if (r) {
      crewAgg.packs += r.packs; crewAgg.coins += r.coins;
      if (r.news.length) { dirty.binder = true; r.news.forEach(function (n) { var c = CARDS[n.id]; if (c.r >= 2 || n.newHolo) toast((n.newHolo && !n.isNew ? '✨ Crew pulled a <b>HOLO</b> ' : 'Crew found <b style="color:' + RAR[c.r].col + '">' + RAR[c.r].name + '</b> ') + c.emo + ' ' + esc(c.name) + (n.isNew ? ' <b>NEW!</b>' : ''), RAR[c.r].col); }); }
    }
    crewAgg.t += dt;
    if (crewAgg.t > 2.5) { if (crewAgg.packs && curView === 'rip') feed('Crew ripped ' + fmt(crewAgg.packs) + ' ' + SETS[st.autoSet].name + ' pack' + (crewAgg.packs > 1 ? 's' : '')); crewAgg = { packs: 0, coins: 0, t: 0 }; }
    if (!gold.classList.contains('on') && !$('modal').classList.contains('on')) { st.goldT -= dt; if (st.goldT <= 0) spawnGold(); }
    if (goldLeft > 0) { goldLeft -= dt; if (goldLeft <= 0) { gold.classList.remove('on'); st.goldT = (150 + Math.random() * 150) * Math.pow(0.77, P(st, 'gold')); } }
  }
  document.body.classList.toggle('frenzy', st.frenzy > 0);
  // header
  $('coinv').textContent = fmt(st.coins);
  $('ipsv').textContent = fmt(income(st));
  $('cloutv').textContent = fmt(st.cloutTot);
  $('hypefill').style.width = (st.frenzy > 0 ? st.frenzy / 20 * 100 : st.hype * 100) + '%';
  $('hypetxt').textContent = st.frenzy > 0 ? 'FRENZY ×' + frenzyMult(st) + ' · ' + Math.ceil(st.frenzy) + 's' : 'HYPE ' + Math.floor(st.hype * 100) + '%';
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateUI(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  if (parts.length || cv._had) { drawParts(); cv._had = parts.length > 0; }
  requestAnimationFrame(frame);
}
function updateUI() {
  var pr = packPrice(st, st.curSet), ok = st.coins >= pr;
  var rb = $('ripBtn');
  rb.classList.toggle('no', !ok && stg.mode === 'pack');
  $('ripCost').textContent = stg.mode === 'reveal' || stg.mode === 'busy' ? 'skip ▸▸' : (ok ? (stg.mode === 'done' ? 'again · ' : '') : 'need ') + '$' + fmt(pr);
  var r10 = $('rip10'); r10.style.display = L(st, 'bulk') ? 'block' : 'none';
  $('rip10Cost').textContent = '$' + fmt(pr * 10); r10.classList.toggle('no', st.coins < pr * 10);
  var ss = setStatus(st, st.curSet);
  $('siL').textContent = SETS[st.curSet].emo + ' ' + ss.have + '/13' + (ss.master ? ' ★ MASTER' : ss.complete ? ' ✓ COMPLETE' : '');
  var cr = crewRate(st);
  $('siR').textContent = cr > 0 ? (st.crewOn ? '👥 ' + (cr / packPrice(st, st.autoSet) < 10 ? (cr / packPrice(st, st.autoSet)).toFixed(1) : fmt(cr / packPrice(st, st.autoSet))) + '/s ' + SETS[st.autoSet].emo : '👥 on break') : '';
  // set bar license glow
  var lk = document.querySelector('#setbar .chip.lock');
  if (lk) lk.classList.toggle('can', st.coins >= SETS[+lk.dataset.s].license);
  // dots
  var shopDot = false, ns = st.unlocked.length;
  if (ns < SETS.length && st.coins >= SETS[ns].license) shopDot = true;
  UPG.forEach(function (u) { var lv = L(st, u.id); if (lv < u.max && st.coins >= upgCost(u, lv)) shopDot = true; });
  var crewDot = false; CREW.forEach(function (c, i) { if (crewVisible(st, i) && st.coins >= crewCost(c, st.crew[c.id] || 0) * 3) crewDot = true; });
  var g = cloutGain(st), cloutDot = (g >= Math.max(10, st.cloutTot * 0.5)) || PERKS.some(function (p) { return P(st, p.id) < p.max && st.clout >= perkCost(p, P(st, p.id)); });
  var dots = document.querySelectorAll('#tabs .dot');
  dots[2].classList.toggle('on', shopDot); dots[3].classList.toggle('on', crewDot); dots[4].classList.toggle('on', cloutDot);
  if (curView !== 'rip') { if (dirty[curView] && curView === 'binder') { VIEWS.binder.build(); dirty.binder = false; } VIEWS[curView].update(); }
}
function saveNow() { if (!resetAll) save(); }
document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); else { lastWall = lastWall; } });
addEventListener('pagehide', saveNow);
document.addEventListener('pointerdown', ensureAudio, { passive: true });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

/* ---------- boot ---------- */
(function boot() {
  var away = (Date.now() - (st.last || Date.now())) / 1000;
  var fresh = !localStorage.getItem(SAVE_KEY);
  if (st.curSet >= st.unlocked.length) st.curSet = 0;
  if (st.autoSet >= st.unlocked.length) st.autoSet = 0;
  renderSetbar(); showPack();
  if (away > 60 && !fresh) runAway(away, true);
  else if (away > 0) runAway(away, false);
  if (fresh) howTo();
  lastWall = Date.now();
  save();
  requestAnimationFrame(frame);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
/* ===== /UI ===== */
</script>
</body>
</html>
