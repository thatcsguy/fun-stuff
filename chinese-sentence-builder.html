<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1719">
  <title>Sentence Studio · Traditional Chinese</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0f1719;
      --ink: #edf5f1;
      --muted: #a9bbb3;
      --line: #354842;
      --teal: #8fd7bd;
      --teal-soft: #1b3931;
      --red: #ffad9d;
      --slot-bg: #172225;
      --tile-bg: #202e2d;
      --tile-active: #294039;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

    .app { width: min(100% - 32px, 900px); margin: 0 auto; padding: clamp(26px, 5vw, 54px) 0 48px; }
    .prompt { margin-bottom: 32px; }
    .prompt h1 { margin: 0; font-size: clamp(24px, 3.5vw, 32px); font-weight: 650; line-height: 1.35; letter-spacing: -.025em; }
    .section-heading { margin: 0 0 14px; }
    .section-heading h2 { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    .slots, .bank { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; }
    .slots { min-height: 90px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--slot-bg); }
    .slot { min-width: 84px; min-height: 70px; display: flex; align-items: stretch; justify-content: center; border: 1.5px dashed #597268; border-radius: 8px; }
    .slot.empty { align-items: center; color: #91a99e; font-size: 13px; font-weight: 700; }
    .slot.filled { border-color: transparent; }
    .slot-number { user-select: none; }
    .sentence-end { align-self: center; margin-left: -3px; font-family: "Noto Serif TC", "Songti TC", serif; font-size: 32px; font-weight: 700; }
    .status { min-height: 22px; margin: 9px 1px 0; color: var(--muted); font-size: 13px; font-weight: 650; line-height: 1.5; }
    .status.success { color: var(--teal); }
    .status.try-again { color: var(--red); }

    .divider { height: 1px; margin: 18px 0 22px; background: var(--line); }
    .bank { min-height: 90px; padding: 3px 0 13px; }
    .tile {
      min-width: 84px; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 8px 14px; border: 1px solid #597268; border-radius: 8px;
      background: var(--tile-bg); color: var(--ink); cursor: pointer;
    }
    .tile:hover { border-color: var(--teal); }
    .tile:active { background: var(--tile-active); }
    .slot .tile { width: 100%; height: 100%; border-color: var(--teal); background: var(--teal-soft); }
    .hanzi { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
    .pinyin { color: var(--teal); font-size: 12px; font-weight: 700; line-height: 1.25; }
    .gloss { color: var(--muted); font-size: 12px; line-height: 1.25; }
    .tile.hinted { min-height: 96px; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding-top: 10px; }
    .tool-group { display: flex; flex-wrap: wrap; gap: 9px; }
    .action { min-height: 46px; padding: 10px 17px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile-bg); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }
    .action:hover { border-color: var(--teal); }
    .action.hint-active { border-color: var(--teal); background: var(--teal-soft); }
    .action.answer { color: var(--teal); }
    .action.next { margin-left: auto; border-color: var(--teal); background: var(--teal); color: #10231d; white-space: nowrap; }
    .action.next:hover { background: #aae8d1; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .app { width: min(100% - 24px, 900px); padding: 24px 0 40px; }
      .prompt { margin-bottom: 25px; }
      .slots { padding: 10px; }
      .slot, .tile { min-width: 72px; min-height: 66px; }
      .tile { padding: 8px 10px; }
      .hanzi { font-size: 28px; }
      .action { min-height: 48px; padding: 10px 13px; }
    }
    @media (max-width: 390px) {
      .tool-group { gap: 7px; }
      .action { font-size: 13px; padding: 10px 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="prompt" aria-label="English sentence"><h1 id="english-sentence"></h1></section>

    <section class="workspace" aria-label="Sentence builder">
      <div class="section-heading"><h2>Your sentence</h2></div>
      <div id="slots" class="slots" aria-label="Sentence slots"></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="divider"></div>
      <div class="section-heading"><h2>Phrase cards</h2></div>
      <div id="bank" class="bank" aria-label="Available phrase cards"></div>
      <div class="toolbar">
        <div class="tool-group">
          <button id="hint-button" class="action" type="button" aria-pressed="false">Show hints</button>
          <button id="answer-button" class="action answer" type="button">Show answer</button>
        </div>
        <button id="next-button" class="action next" type="button" hidden>Next sentence <span aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // Cards are listed in their target order. Movable cards contain no punctuation.
    const sentences = [
      {
        english: "If it rains tomorrow, we'll stay at home.",
        ending: "。", pattern: "如果…就…", note: "The condition comes first; 就 introduces what happens if that condition is met.",
        cards: [
          ["如果", "rúguǒ", "if"], ["明天", "míngtiān", "tomorrow"], ["下雨", "xiàyǔ", "rains"],
          ["我們", "wǒmen", "we"], ["就", "jiù", "then"], ["待在", "dāi zài", "stay at"], ["家裡", "jiālǐ", "home"]
        ]
      },
      {
        english: "Although she's busy, she cooks dinner every day.",
        ending: "。", pattern: "雖然…但是…", note: "雖然 introduces the contrast; 但是 starts the main point.",
        cards: [
          ["雖然", "suīrán", "although"], ["她", "tā", "she"], ["很忙", "hěn máng", "is busy"],
          ["但是", "dànshì", "but"], ["她", "tā", "she"], ["每天", "měitiān", "every day"],
          ["都會", "dōu huì", "always / will"], ["做晚餐", "zuò wǎncān", "make dinner"]
        ]
      },
      {
        english: "I put the book on the table.",
        ending: "。", pattern: "把 + object + verb", note: "把 brings the affected object before the action and its result or destination.",
        cards: [
          ["我", "wǒ", "I"], ["把", "bǎ", "object marker"], ["書", "shū", "book"],
          ["放在", "fàng zài", "put at"], ["桌上", "zhuō shàng", "on the table"]
        ]
      },
      {
        english: "The window was blown open by the wind.",
        ending: "。", pattern: "被 + agent + verb", note: "被 places the affected thing first, followed by who or what caused the action.",
        cards: [
          ["窗戶", "chuānghù", "window"], ["被", "bèi", "by / passive"], ["風", "fēng", "wind"],
          ["吹開了", "chuī kāi le", "blew open"]
        ]
      },
      {
        english: "As soon as I got home, I called my mother.",
        ending: "。", pattern: "一…就…", note: "一…就… links an event with what happened immediately afterward.",
        cards: [
          ["我", "wǒ", "I"], ["一", "yí", "as soon as"], ["到家", "dào jiā", "got home"],
          ["就", "jiù", "then"], ["打電話給", "dǎ diànhuà gěi", "called"], ["媽媽", "māma", "mother"]
        ]
      },
      {
        english: "Do you know when the movie starts?",
        ending: "？", pattern: "Embedded question", note: "The question phrase 什麼時候 stays before the verb inside the larger question.",
        cards: [
          ["你", "nǐ", "you"], ["知道", "zhīdào", "know"], ["電影", "diànyǐng", "movie"],
          ["什麼時候", "shénme shíhòu", "when"], ["開始", "kāishǐ", "starts"], ["嗎", "ma", "question particle"]
        ]
      },
      {
        english: "The colder the weather gets, the more I want hot tea.",
        ending: "。", pattern: "越…越…", note: "Two 越 phrases show that one change increases along with another.",
        cards: [
          ["天氣", "tiānqì", "weather"], ["越冷", "yuè lěng", "the colder"], ["我", "wǒ", "I"],
          ["就", "jiù", "then"], ["越想", "yuè xiǎng", "the more I want"], ["喝熱茶", "hē rè chá", "drink hot tea"]
        ]
      },
      {
        english: "Please wash your hands before eating.",
        ending: "。", pattern: "先…再…", note: "先 marks the first action; 再 marks the action that follows.",
        cards: [
          ["請", "qǐng", "please"], ["先", "xiān", "first"], ["洗手", "xǐshǒu", "wash hands"],
          ["再", "zài", "then"], ["吃飯", "chīfàn", "eat"]
        ]
      },
      {
        english: "Even my younger brother knows the answer.",
        ending: "。", pattern: "連…都…", note: "連 singles out a surprising example; 都 goes before the verb.",
        cards: [
          ["連", "lián", "even"], ["我弟弟", "wǒ dìdi", "my younger brother"], ["都", "dōu", "even / also"],
          ["知道", "zhīdào", "knows"], ["答案", "dá'àn", "answer"]
        ]
      },
      {
        english: "It was yesterday at the station that I met her.",
        ending: "。", pattern: "是…的", note: "是…的 frames a completed event and highlights details such as when or where it happened.",
        cards: [
          ["我", "wǒ", "I"], ["是", "shì", "emphasis marker"], ["昨天", "zuótiān", "yesterday"],
          ["在車站", "zài chēzhàn", "at the station"], ["遇到", "yùdào", "met"],
          ["她", "tā", "her"], ["的", "de", "emphasis particle"]
        ]
      },
      {
        english: "Besides English, he also speaks Japanese.",
        ending: "。", pattern: "除了…以外，還…", note: "除了…以外 introduces what is already included; 還 adds another thing.",
        cards: [
          ["除了", "chúle", "besides"], ["英文", "Yīngwén", "English"], ["以外", "yǐwài", "apart from"],
          ["他", "tā", "he"], ["還會", "hái huì", "also can"], ["說", "shuō", "speak"], ["日文", "Rìwén", "Japanese"]
        ]
      },
      {
        english: "Since you already know, I won't explain it again.",
        ending: "。", pattern: "既然…就…", note: "既然 gives an accepted fact; 就 introduces the decision based on it.",
        cards: [
          ["既然", "jìrán", "since"], ["你", "nǐ", "you"], ["已經", "yǐjīng", "already"],
          ["知道了", "zhīdào le", "know"], ["我", "wǒ", "I"], ["就", "jiù", "then"],
          ["不再", "bú zài", "not anymore"], ["解釋了", "jiěshì le", "explain"]
        ]
      },
      {
        english: "Only after finishing the work can we rest.",
        ending: "。", pattern: "只有…才…", note: "只有 states the necessary condition; 才 marks the result that becomes possible.",
        cards: [
          ["只有", "zhǐyǒu", "only if"], ["把", "bǎ", "object marker"], ["工作", "gōngzuò", "work"],
          ["做完", "zuò wán", "finish"], ["我們", "wǒmen", "we"], ["才能", "cái néng", "only then can"],
          ["休息", "xiūxí", "rest"]
        ]
      },
      {
        english: "She can not only sing but also dance.",
        ending: "。", pattern: "不但…而且…", note: "不但 introduces the first ability; 而且 adds a second one.",
        cards: [
          ["她", "tā", "she"], ["不但", "búdàn", "not only"], ["會唱歌", "huì chànggē", "can sing"],
          ["而且", "érqiě", "but also"], ["會跳舞", "huì tiàowǔ", "can dance"]
        ]
      },
      {
        english: "It wasn't that I forgot; I just didn't have time.",
        ending: "。", pattern: "不是…而是…", note: "不是 rejects one explanation; 而是 gives the real one.",
        cards: [
          ["我", "wǒ", "I"], ["不是", "bú shì", "it isn't that"], ["忘記了", "wàngjì le", "forgot"],
          ["而是", "érshì", "but rather"], ["沒有時間", "méiyǒu shíjiān", "had no time"]
        ]
      },
      {
        english: "This bag is as heavy as that one.",
        ending: "。", pattern: "跟…一樣…", note: "跟 introduces the comparison; 一樣 comes before the shared quality.",
        cards: [
          ["這個", "zhège", "this"], ["袋子", "dàizi", "bag"], ["跟", "gēn", "with / as"],
          ["那個", "nàge", "that one"], ["一樣", "yíyàng", "equally"], ["重", "zhòng", "heavy"]
        ]
      },
      {
        english: "He didn't leave until the rain stopped.",
        ending: "。", pattern: "直到…才…", note: "直到 names the point in time; 才 shows that the action waited until then.",
        cards: [
          ["他", "tā", "he"], ["直到", "zhídào", "until"], ["雨停了", "yǔ tíng le", "the rain stopped"],
          ["才", "cái", "only then"], ["離開", "líkāi", "left"]
        ]
      },
      {
        english: "In order to catch the train, we left early.",
        ending: "。", pattern: "為了…", note: "為了 puts the purpose before the action taken to achieve it.",
        cards: [
          ["為了", "wèile", "in order to"], ["趕上", "gǎnshàng", "catch"], ["火車", "huǒchē", "train"],
          ["我們", "wǒmen", "we"], ["提早", "tízǎo", "early"], ["出門", "chūmén", "left home"]
        ]
      },
      {
        english: "As long as you ask for help, someone will help you.",
        ending: "。", pattern: "只要…就…", note: "只要 sets a sufficient condition; 就 introduces the expected result.",
        cards: [
          ["只要", "zhǐyào", "as long as"], ["你", "nǐ", "you"], ["開口求助", "kāikǒu qiúzhù", "ask for help"],
          ["就會", "jiù huì", "then will"], ["有人", "yǒu rén", "someone"], ["幫你", "bāng nǐ", "help you"]
        ]
      },
      {
        english: "Even if it's expensive, I still want to try it.",
        ending: "。", pattern: "即使…還是…", note: "即使 introduces a possible obstacle; 還是 shows that the decision remains the same.",
        cards: [
          ["即使", "jíshǐ", "even if"], ["很貴", "hěn guì", "expensive"], ["我", "wǒ", "I"],
          ["還是", "háishì", "still"], ["想", "xiǎng", "want to"], ["試試看", "shìshi kàn", "give it a try"]
        ]
      }
    ];

    const C = (hanzi, pinyin, gloss) => [hanzi, pinyin, gloss];
    const I = C("我", "wǒ", "I");
    const YOU = C("你", "nǐ", "you");
    const WE = C("我們", "wǒmen", "we");
    const add = (english, cards, ending = "。") => sentences.push({ english, cards, ending });
    const expand = (lines, build) => lines.forEach((line) => build(...line.split("|")));

    // Everyday routines, errands, and plans.
    expand([
      "buy groceries|買菜|mǎi cài",
      "do laundry|洗衣服|xǐ yīfú",
      "pay the electricity bill|繳電費|jiǎo diànfèi",
      "call the dentist|打電話給牙醫|dǎ diànhuà gěi yáyī",
      "pick up the package|去拿包裹|qù ná bāoguǒ",
      "charge my phone|幫手機充電|bāng shǒujī chōngdiàn",
      "clean the kitchen|打掃廚房|dǎsǎo chúfáng",
      "reply to that email|回覆那封郵件|huífù nà fēng yóujiàn",
      "book a table|訂位|dìngwèi",
      "buy cat food|買貓飼料|mǎi māo sìliào",
      "print the documents|列印文件|lièyìn wénjiàn",
      "take out the trash|倒垃圾|dào lèsè"
    ], (en, zh, py) => add("I need to " + en + " today.", [I, C("今天", "jīntiān", "today"), C("得", "děi", "need to"), C(zh, py, en)]));

    expand([
      "go hiking|去爬山|qù páshān",
      "watch a movie|看電影|kàn diànyǐng",
      "visit my grandparents|去看爺爺奶奶|qù kàn yéye nǎinai",
      "try that new restaurant|去吃那家新餐廳|qù chī nà jiā xīn cāntīng",
      "sleep in|睡晚一點|shuì wǎn yìdiǎn",
      "go to the beach|去海邊|qù hǎibiān",
      "meet some friends|跟朋友見面|gēn péngyǒu jiànmiàn",
      "read at a cafe|去咖啡店看書|qù kāfēidiàn kàn shū",
      "cook something new|試做一道新菜|shì zuò yí dào xīn cài",
      "walk around the night market|逛夜市|guàng yèshì",
      "take a short day trip|去附近走走|qù fùjìn zǒuzou",
      "stay home and rest|待在家休息|dāi zài jiā xiūxí"
    ], (en, zh, py) => add("I want to " + en + " this weekend.", [I, C("這個週末", "zhège zhōumò", "this weekend"), C("想", "xiǎng", "want to"), C(zh, py, en)]));

    expand([
      "my umbrella|雨傘|yǔsǎn",
      "my keys|鑰匙|yàoshi",
      "my wallet|錢包|qiánbāo",
      "my phone|手機|shǒujī",
      "my charger|充電器|chōngdiànqì",
      "my water bottle|水壺|shuǐhú",
      "my jacket|外套|wàitào",
      "my ID|身分證|shēnfènzhèng",
      "my lunch|午餐|wǔcān",
      "my glasses|眼鏡|yǎnjìng",
      "my notebook|筆記本|bǐjìběn",
      "my transit card|悠遊卡|Yōuyóukǎ"
    ], (en, zh, py) => add("I forgot to bring " + en + ".", [I, C("忘了", "wàng le", "forgot to"), C("帶", "dài", "bring"), C(zh, py, en)]));

    expand([
      "keys|鑰匙|yàoshi|at home|家裡|jiālǐ",
      "wallet|錢包|qiánbāo|at the office|辦公室|bàngōngshì",
      "umbrella|雨傘|yǔsǎn|on the bus|公車上|gōngchē shàng",
      "phone|手機|shǒujī|in the car|車上|chē shàng",
      "book|書|shū|at school|學校|xuéxiào",
      "coat|外套|wàitào|at the restaurant|餐廳|cāntīng",
      "bag|包包|bāobāo|at my friend's place|朋友家|péngyǒu jiā",
      "glasses|眼鏡|yǎnjìng|in the bedroom|臥室|wòshì",
      "lunch|午餐|wǔcān|in the fridge|冰箱裡|bīngxiāng lǐ",
      "ticket|車票|chēpiào|on the desk|桌上|zhuō shàng",
      "charger|充電器|chōngdiànqì|at the hotel|飯店|fàndiàn",
      "notebook|筆記本|bǐjìběn|in the meeting room|會議室|huìyìshì"
    ], (enItem, zhItem, pyItem, enPlace, zhPlace, pyPlace) => add("I left my " + enItem + " " + enPlace + ".", [I, C("把", "bǎ", "object marker"), C(zhItem, pyItem, enItem), C("忘在", "wàng zài", "left at"), C(zhPlace, pyPlace, enPlace), C("了", "le", "completed action")]));

    expand([
      "My mom|我媽|wǒ mā|cooking dinner|煮晚餐|zhǔ wǎncān",
      "My dad|我爸|wǒ bà|washing the dishes|洗碗|xǐ wǎn",
      "My sister|我妹妹|wǒ mèimei|doing homework|寫作業|xiě zuòyè",
      "My brother|我弟弟|wǒ dìdi|playing basketball|打籃球|dǎ lánqiú",
      "My roommate|我室友|wǒ shìyǒu|taking a shower|洗澡|xǐzǎo",
      "My friend|我朋友|wǒ péngyǒu|waiting outside|外面等|wàimiàn děng",
      "My coworker|我同事|wǒ tóngshì|making coffee|泡咖啡|pào kāfēi",
      "The teacher|老師|lǎoshī|talking to a parent|跟家長說話|gēn jiāzhǎng shuōhuà",
      "My neighbor|我鄰居|wǒ línjū|walking the dog|遛狗|liù gǒu",
      "My wife|我太太|wǒ tàitai|putting the baby to sleep|哄寶寶睡覺|hǒng bǎobao shuìjiào",
      "My husband|我先生|wǒ xiānsheng|fixing his bike|修腳踏車|xiū jiǎotàchē",
      "The cashier|店員|diànyuán|helping a customer|幫客人結帳|bāng kèrén jiézhàng"
    ], (enPerson, zhPerson, pyPerson, enAction, zhAction, pyAction) => add(enPerson + " is " + enAction + " right now.", [C(zhPerson, pyPerson, enPerson), C("現在", "xiànzài", "right now"), C("正在", "zhèngzài", "in the middle of"), C(zhAction, pyAction, enAction)]));

    expand([
      "drink water|喝水|hē shuǐ",
      "check my messages|看訊息|kàn xùnxí",
      "take a shower|洗澡|xǐzǎo",
      "walk the dog|遛狗|liù gǒu",
      "make coffee|泡咖啡|pào kāfēi",
      "stretch|拉筋|lā jīn",
      "open the windows|開窗戶|kāi chuānghù",

      "the bus will be late|公車|gōngchē|會晚到|huì wǎn dào|the bus|will be late",
      "the room is too cold|房間|fángjiān|太冷了|tài lěng le|the room|is too cold",
      "this size fits|這個尺寸|zhège chǐcùn|剛好|gānghǎo|this size|fits",
      "we should leave early|我們|wǒmen|應該早點走|yīnggāi zǎodiǎn zǒu|we|should leave early",
      "the food needs more salt|這道菜|zhè dào cài|需要再加點鹽|xūyào zài jiā diǎn yán|the food|needs more salt",
      "he looks tired|他|tā|看起來很累|kàn qǐlái hěn lèi|he|looks tired",
      "this road is faster|這條路|zhè tiáo lù|比較快|bǐjiào kuài|this road|is faster",
      "this movie is worth watching|這部電影|zhè bù diànyǐng|值得看|zhídé kàn|this movie|is worth watching",
      "it will rain soon|等一下|děng yíxià|會下雨|huì xiàyǔ|soon|will rain",

    ], (enClause, zhSubject, pySubject, zhPredicate, pyPredicate, enSubject, enPredicate) => add("I think " + enClause + ".", [I, C("覺得", "juéde", "think"), C(zhSubject, pySubject, enSubject), C(zhPredicate, pyPredicate, enPredicate)]));

    expand([
      "the new cafe has opened|新咖啡店|xīn kāfēidiàn|開了|kāi le|the new cafe|has opened",
      "our train is delayed|我們的火車|wǒmen de huǒchē|誤點了|wùdiǎn le|our train|is delayed",
      "she got a new job|她|tā|找到新工作了|zhǎodào xīn gōngzuò le|she|got a new job",
      "school is closed tomorrow|學校|xuéxiào|明天放假|míngtiān fàngjià|school|is closed tomorrow",
      "our neighbor is moving|鄰居|línjū|要搬家了|yào bānjiā le|our neighbor|is moving",
      "that restaurant is good|那家餐廳|nà jiā cāntīng|很好吃|hěn hǎochī|that restaurant|has good food",
      "the price went up|價格|jiàgé|漲了|zhǎng le|the price|went up",
      "the meeting moved to Friday|會議|huìyì|改到星期五了|gǎi dào xīngqīwǔ le|the meeting|moved to Friday",
      "he is sick|他|tā|生病了|shēngbìng le|he|is sick",
      "the weather will improve tomorrow|明天的天氣|míngtiān de tiānqì|會變好|huì biàn hǎo|the weather tomorrow|will improve",
      "the store is closing early today|店|diàn|今天提早關門|jīntiān tízǎo guānmén|the store|is closing early today",
      "the bus route changed|公車路線|gōngchē lùxiàn|改了|gǎi le|the bus route|changed"
    ], (enClause, zhSubject, pySubject, zhPredicate, pyPredicate, enSubject, enPredicate) => add("I heard " + enClause + ".", [I, C("聽說", "tīngshuō", "heard that"), C(zhSubject, pySubject, enSubject), C(zhPredicate, pyPredicate, enPredicate)]));

    const questionCards = (encoded) => encoded.split(";").map((part) => C(...part.split("~")));
    expand([
      "where the restroom is|洗手間~xǐshǒujiān~restroom;在哪裡~zài nǎlǐ~where it is",
      "what time the train leaves|火車~huǒchē~train;幾點~jǐ diǎn~what time;出發~chūfā~leaves",
      "when the store closes|店~diàn~store;幾點~jǐ diǎn~what time;關門~guānmén~closes",
      "whether she is coming|她~tā~she;會不會~huì bú huì~whether;來~lái~come",
      "how much the ticket costs|票~piào~ticket;多少錢~duōshǎo qián~how much",
      "who took my umbrella|誰~shéi~who;拿走~ná zǒu~took;我的雨傘~wǒ de yǔsǎn~my umbrella",
      "where he went|他~tā~he;去了~qù le~went;哪裡~nǎlǐ~where",
      "why the bus is late|公車~gōngchē~bus;為什麼~wèishénme~why;晚到~wǎn dào~late",
      "which floor the clinic is on|診所~zhěnsuǒ~clinic;在~zài~is on;幾樓~jǐ lóu~which floor",
      "where the package is|包裹~bāoguǒ~package;在哪裡~zài nǎlǐ~where it is",
      "when the meeting starts|會議~huìyì~meeting;什麼時候~shénme shíhòu~when;開始~kāishǐ~starts",
      "how to use this machine|這台機器~zhè tái jīqì~this machine;怎麼~zěnme~how to;用~yòng~use"
    ], (enQuestion, encoded) => add("I don't know " + enQuestion + ".", [I, C("不知道", "bù zhīdào", "don't know"), ...questionCards(encoded)]));

    expand([
      "order takeout|叫外送|jiào wàisòng|cook at home|自己煮|zìjǐ zhǔ",
      "take a taxi|搭計程車|dā jìchéngchē|walk|走路|zǒulù",
      "go out tonight|今晚出門|jīnwǎn chūmén|stay home|待在家|dāi zài jiā",
      "drink coffee|喝咖啡|hē kāfēi|have tea|喝茶|hē chá",
      "wait in line|排隊|páiduì|come back later|晚點再來|wǎndiǎn zài lái",
      "argue|吵架|chǎojià|talk calmly|好好談|hǎohǎo tán",
      "buy a new phone|買新手機|mǎi xīn shǒujī|repair this one|修這支|xiū zhè zhī",
      "watch TV|看電視|kàn diànshì|read|看書|kàn shū",
      "eat out|外食|wài shí|make dinner|煮晚餐|zhǔ wǎncān",
      "drive|開車|kāi chē|take the train|搭火車|dā huǒchē",
      "buy it now|現在買|xiànzài mǎi|wait for a sale|等特價|děng tèjià",
      "rush|趕時間|gǎn shíjiān|leave a little earlier|早點出門|zǎodiǎn chūmén"
    ], (enA, zhA, pyA, enB, zhB, pyB) => add("I don't want to " + enA + "; I'd rather " + enB + ".", [I, C("不想", "bù xiǎng", "don't want to"), C(zhA, pyA, enA), C("比較想", "bǐjiào xiǎng", "would rather"), C(zhB, pyB, enB)]));

    expand([
      "you call me|你打給我|nǐ dǎ gěi wǒ|pick you up|去接你|qù jiē nǐ",
      "the bus is on time|公車準時|gōngchē zhǔnshí|make the meeting|趕上會議|gǎnshàng huìyì",
      "the weather is nice|天氣好|tiānqì hǎo|walk to work|走路上班|zǒulù shàngbān",
      "you send the address|你傳地址給我|nǐ chuán dìzhǐ gěi wǒ|find the place|找到那個地方|zhǎodào nàge dìfāng",
      "the meeting ends early|會議提早結束|huìyì tízǎo jiéshù|come over|過去|guòqù",
      "we leave now|我們現在出門|wǒmen xiànzài chūmén|catch the train|趕上火車|gǎnshàng huǒchē",
      "my phone still has power|手機還有電|shǒujī hái yǒu diàn|call you|打給你|dǎ gěi nǐ",
      "you explain it once more|你再解釋一次|nǐ zài jiěshì yí cì|understand|聽懂|tīngdǒng",
      "I have time tonight|我今晚有空|wǒ jīnwǎn yǒu kòng|finish it|做完|zuò wán",
      "the price drops|價格降低|jiàgé jiàngdī|buy it|買下來|mǎi xiàlái",
      "you wait five minutes|你等五分鐘|nǐ děng wǔ fēnzhōng|get there|趕到|gǎn dào",
      "the cafe has seats|咖啡店有位子|kāfēidiàn yǒu wèizi|sit down|坐下|zuòxià"
    ], (enCondition, zhCondition, pyCondition, enResult, zhResult, pyResult) => add("As long as " + enCondition + ", I can " + enResult + ".", [C("只要", "zhǐyào", "as long as"), C(zhCondition, pyCondition, enCondition), I, C("就能", "jiù néng", "then can"), C(zhResult, pyResult, enResult)]));

    expand([
      "it rains|下雨|xiàyǔ|go out|出門|chūmén",
      "it's late|很晚了|hěn wǎn le|finish this|把這件事做完|bǎ zhè jiàn shì zuò wán",
      "it's expensive|很貴|hěn guì|buy it|買|mǎi",
      "it's crowded|人很多|rén hěn duō|wait|等|děng",
      "I'm tired|我很累|wǒ hěn lèi|cook dinner|煮晚餐|zhǔ wǎncān",
      "it's cold|天氣很冷|tiānqì hěn lěng|walk to work|走路上班|zǒulù shàngbān",
      "I don't know the way|我不認識路|wǒ bú rènshi lù|give it a try|試試看|shìshi kàn",
      "no one else goes|別人都不去|biérén dōu bú qù|go|去|qù",
      "the bus is slow|公車很慢|gōngchē hěn màn|take it|搭公車|dā gōngchē",
      "the food is spicy|菜很辣|cài hěn là|eat it|吃這道菜|chī zhè dào cài",
      "I'm busy|我很忙|wǒ hěn máng|call my mom|打電話給媽媽|dǎ diànhuà gěi māma",
      "the train is delayed|火車誤點|huǒchē wùdiǎn|wait|等|děng"
    ], (enCondition, zhCondition, pyCondition, enResult, zhResult, pyResult) => add("Even if " + enCondition + ", I'll still " + enResult + ".", [C("就算", "jiùsuàn", "even if"), C(zhCondition, pyCondition, enCondition), I, C("也", "yě", "still"), C(zhResult, pyResult, enResult)]));

    const $ = (id) => document.getElementById(id);
    const ui = {
      english: $("english-sentence"), slots: $("slots"), bank: $("bank"), status: $("status"),
      hint: $("hint-button"), answer: $("answer-button"), next: $("next-button")
    };
    let deck = [];
    let deckPosition = 0;
    let currentIndex = -1;
    let placed = [];
    let bankOrder = [];
    let hintsVisible = false;
    let wasCorrect = false;

    function shuffle(values) {
      const result = [...values];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function refillDeck() {
      const previous = currentIndex;
      deck = shuffle(sentences.map((_, index) => index));
      if (deck.length > 1 && deck[0] === previous) [deck[0], deck[1]] = [deck[1], deck[0]];
      deckPosition = 0;
    }

    function loadSentence() {
      if (deckPosition >= deck.length) refillDeck();
      currentIndex = deck[deckPosition++];
      const count = sentences[currentIndex].cards.length;
      placed = Array(count).fill(null);
      bankOrder = shuffle(Array.from({ length: count }, (_, index) => index));
      // Keep the initial row from accidentally revealing the complete answer.
      if (count > 1 && bankOrder.every((id, position) => id === position)) [bankOrder[0], bankOrder[1]] = [bankOrder[1], bankOrder[0]];
      hintsVisible = false;
      wasCorrect = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function makeTile(id, location) {
      const [hanzi, pinyin, gloss] = sentences[currentIndex].cards[id];
      const button = document.createElement("button");
      button.type = "button";
      button.className = `tile${hintsVisible ? " hinted" : ""}`;
      button.setAttribute("aria-label", `${location === "slot" ? "Return" : "Place"} ${hanzi}${hintsVisible ? `, ${pinyin}, ${gloss}` : ""}`);
      const characters = document.createElement("span");
      characters.className = "hanzi";
      characters.textContent = hanzi;
      button.append(characters);
      if (hintsVisible) {
        const romanization = document.createElement("span");
        romanization.className = "pinyin";
        romanization.textContent = pinyin;
        const translation = document.createElement("span");
        translation.className = "gloss";
        translation.textContent = gloss;
        button.append(romanization, translation);
      }
      if (location === "slot") {
        button.addEventListener("click", () => {
          const slotIndex = placed.indexOf(id);
          if (slotIndex === -1) return;
          placed[slotIndex] = null;
          bankOrder.push(id);
          render();
        });
      } else {
        button.addEventListener("click", () => {
          const slotIndex = placed.indexOf(null);
          if (slotIndex === -1) return;
          placed[slotIndex] = id;
          bankOrder = bankOrder.filter((cardId) => cardId !== id);
          render();
        });
      }
      return button;
    }

    function render() {
      const sentence = sentences[currentIndex];
      const complete = placed.every((id) => id !== null);
      const correct = complete && placed.every((id, index) => id === index);
      if (correct && !wasCorrect) hintsVisible = true;
      wasCorrect = correct;
      ui.english.textContent = sentence.english;
      ui.slots.replaceChildren();
      placed.forEach((id, index) => {
        const slot = document.createElement("div");
        slot.className = `slot ${id === null ? "empty" : "filled"}`;
        if (id === null) {
          const number = document.createElement("span");
          number.className = "slot-number";
          number.textContent = String(index + 1);
          slot.append(number);
        } else {
          slot.append(makeTile(id, "slot"));
        }
        ui.slots.append(slot);
      });
      const ending = document.createElement("span");
      ending.className = "sentence-end";
      ending.textContent = sentence.ending;
      ui.slots.append(ending);
      ui.bank.replaceChildren(...bankOrder.map((id) => makeTile(id, "bank")));
      ui.hint.textContent = hintsVisible ? "Hide hints" : "Show hints";
      ui.hint.classList.toggle("hint-active", hintsVisible);
      ui.hint.setAttribute("aria-pressed", String(hintsVisible));
      ui.status.className = `status${correct ? " success" : complete ? " try-again" : ""}`;
      ui.status.textContent = correct ? "Correct" : complete ? "Try again" : "";
      ui.next.hidden = !correct;
    }

    ui.hint.addEventListener("click", () => { hintsVisible = !hintsVisible; render(); });
    ui.answer.addEventListener("click", () => {
      placed = sentences[currentIndex].cards.map((_, index) => index);
      bankOrder = [];
      render();
    });
    ui.next.addEventListener("click", loadSentence);

    refillDeck();
    loadSentence();
  </script>
</body>
</html>
