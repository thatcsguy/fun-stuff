<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TOCFL 1A Traditional Chinese Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #f8fafc;
      --card-2: #eef2ff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #f59e0b;
      --accent-dark: #b45309;
      --white: #fff;
      --shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--white);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
      overflow: hidden;
    }
    .app {
      width: min(100%, 520px);
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 14px 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .title { min-width: 0; }
    h1 { font-size: 1rem; line-height: 1.2; margin: 0; font-weight: 750; letter-spacing: .01em; }
    .meta { color: #cbd5e1; font-size: .78rem; margin-top: 3px; }
    button {
      border: 0;
      border-radius: 999px;
      font: inherit;
      color: var(--white);
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(.98); }
    .toggle {
      padding: 10px 13px;
      font-size: .82rem;
      font-weight: 700;
      white-space: nowrap;
      background: rgba(245, 158, 11, .22);
    }
    .font-toggle {
      background: rgba(255,255,255,.18);
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      top: calc(12px + env(safe-area-inset-top));
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    header { padding-top: 52px; }
    main {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .card-wrap {
      width: 100%;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 8px;
    }
    .nav {
      width: 48px;
      height: 92px;
      font-size: 2rem;
      line-height: 1;
      display: grid;
      place-items: center;
      color: #e2e8f0;
      user-select: none;
    }
    .flashcard {
      width: 100%;
      min-height: min(66svh, 520px);
      border-radius: 30px;
      background: linear-gradient(150deg, var(--card), var(--card-2));
      color: var(--text);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      padding: 30px 22px;
      text-align: center;
      user-select: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .flashcard::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 10%, rgba(245,158,11,.18), transparent 34%);
      pointer-events: none;
    }
    .content { position: relative; z-index: 1; width: 100%; }
    .label {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 22px;
    }
    .zh {
      font-size: clamp(3.1rem, 17vw, 6.8rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: .02em;
      overflow-wrap: anywhere;
    }
    body.zh-font-serif .zh { font-family: "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", serif; }
    body.zh-font-sans .zh { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif; }
    body.zh-font-kai .zh { font-family: "Kaiti TC", "DFKai-SB", "BiauKai", "KaiTi", serif; font-weight: 700; }
    body.zh-font-ming .zh { font-family: "PMingLiU", "MingLiU", "Songti TC", "Noto Serif TC", serif; font-weight: 700; }
    .en {
      font-size: clamp(2rem, 8vw, 3.4rem);
      line-height: 1.13;
      font-weight: 800;
      text-wrap: balance;
    }
    .pinyin {
      margin-top: 22px;
      color: var(--accent-dark);
      font-size: clamp(1.35rem, 5.5vw, 2.2rem);
      font-weight: 800;
      line-height: 1.25;
    }
    .hint {
      margin-top: 26px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 650;
    }
    footer {
      display: grid;
      gap: 10px;
      padding: 0 4px 6px;
    }
    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #cbd5e1;
      font-size: .86rem;
      font-weight: 650;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      overflow: hidden;
    }
    .fill { height: 100%; width: 0%; background: var(--accent); border-radius: inherit; transition: width .18s ease; }
    .small-actions { display: flex; justify-content: center; gap: 8px; }
    .small-actions button { padding: 9px 13px; font-size: .82rem; font-weight: 700; }
    @media (max-width: 380px) {
      .card-wrap { grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 5px; }
      .nav { width: 40px; height: 82px; font-size: 1.7rem; }
      .flashcard { border-radius: 24px; padding-inline: 16px; }
      .toggle { padding: 9px 10px; font-size: .76rem; }
      .header-actions { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>TOCFL 1A Flashcards</h1>
        <div class="meta">Traditional Chinese · shuffled on load · font button top-left</div>
      </div>
      <div class="header-actions">
        <button id="fontToggle" class="toggle font-toggle" type="button" aria-label="Change Chinese font">Font: Serif</button>
        <button id="toggleDefault" class="toggle" type="button" aria-label="Change starting side">Start: 中文</button>
      </div>
    </header>

    <main>
      <div class="card-wrap" aria-live="polite">
        <button id="prev" class="nav" type="button" aria-label="Previous card">‹</button>
        <section id="card" class="flashcard" role="button" tabindex="0" aria-label="Flashcard. Tap to flip.">
          <div id="content" class="content"></div>
        </section>
        <button id="next" class="nav" type="button" aria-label="Next card">›</button>
      </div>
    </main>

    <footer>
      <div class="progress">
        <span id="count">1 / 160</span>
        <span id="sideLabel">Front</span>
      </div>
      <div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div>
      <div class="small-actions">
        <button id="footerFontToggle" type="button">Font: Serif</button>
        <button id="reshuffle" type="button">Reshuffle</button>
      </div>
    </footer>
  </div>

    let cards = [];
    let index = 0;
    let flipped = false;
    let defaultSide = localStorage.getItem('tocfl-default-side') || 'zh';
    const zhFonts = [
      { id: 'serif', label: 'Serif' },
      { id: 'sans', label: 'Sans' },
      { id: 'kai', label: 'Kai' },
      { id: 'ming', label: 'Ming' }
    ];
    let zhFontIndex = Math.max(0, zhFonts.findIndex(f => f.id === (localStorage.getItem('tocfl-zh-font') || 'serif')));

    const content = document.getElementById('content');
    const count = document.getElementById('count');
    const fill = document.getElementById('fill');
    const sideLabel = document.getElementById('sideLabel');
    const toggleDefault = document.getElementById('toggleDefault');
    const fontToggle = document.getElementById('fontToggle');
    const footerFontToggle = document.getElementById('footerFontToggle');
    const cardEl = document.getElementById('card');

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[c]));
    }

    function applyChineseFont() {
      const font = zhFonts[zhFontIndex];
      document.body.classList.remove(...zhFonts.map(f => `zh-font-${f.id}`));
      document.body.classList.add(`zh-font-${font.id}`);
      fontToggle.textContent = `Font: ${font.label}`;
      if (footerFontToggle) footerFontToggle.textContent = `Font: ${font.label}`;
      localStorage.setItem('tocfl-zh-font', font.id);
    }

    function render() {
      const c = cards[index];
      const showingDefault = !flipped;
      const showZh = defaultSide === 'zh' ? showingDefault : !showingDefault;

      toggleDefault.textContent = defaultSide === 'zh' ? 'Start: 中文' : 'Start: English';
      sideLabel.textContent = showingDefault ? 'Front' : 'Back';
      count.textContent = `${index + 1} / ${cards.length}`;
      fill.style.width = `${((index + 1) / cards.length) * 100}%`;

      if (showZh) {
        content.innerHTML = `
          <div class="label">Traditional Chinese</div>
          <div class="zh">${escapeHTML(c.zh)}</div>
          ${flipped || defaultSide === 'en' ? `<div class="pinyin">${escapeHTML(c.pinyin)}</div>` : ''}
          <div class="hint">Tap card to flip</div>
        `;
      } else {
        content.innerHTML = `
          <div class="label">English</div>
          <div class="en">${escapeHTML(c.en)}</div>
          ${flipped && defaultSide === 'zh' ? `<div class="pinyin">${escapeHTML(c.pinyin)}</div>` : ''}
          <div class="hint">Tap card to flip</div>
        `;
      }
    }

    function showCard(newIndex) {
      index = (newIndex + cards.length) % cards.length;
      flipped = false;
      render();
    }

    function flip() {
      flipped = !flipped;
      render();
    }

    function reshuffle() {
      cards = shuffle(ORIGINAL_CARDS);
      showCard(0);
    }

    document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); showCard(index - 1); });
    document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); showCard(index + 1); });
    document.getElementById('reshuffle').addEventListener('click', reshuffle);
    cardEl.addEventListener('click', flip);
    cardEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
      if (e.key === 'ArrowRight') showCard(index + 1);
      if (e.key === 'ArrowLeft') showCard(index - 1);
    });
    toggleDefault.addEventListener('click', () => {
      defaultSide = defaultSide === 'zh' ? 'en' : 'zh';
      localStorage.setItem('tocfl-default-side', defaultSide);
      flipped = false;
      render();
    });
    function cycleChineseFont() {
      zhFontIndex = (zhFontIndex + 1) % zhFonts.length;
      applyChineseFont();
    }
    fontToggle.addEventListener('click', cycleChineseFont);
    if (footerFontToggle) footerFontToggle.addEventListener('click', cycleChineseFont);

    let touchStartX = null;
    cardEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive: true});
    cardEl.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) > 70) {
        dx < 0 ? showCard(index + 1) : showCard(index - 1);
      }
    }, {passive: true});

    applyChineseFont();
    reshuffle();
  </script>
